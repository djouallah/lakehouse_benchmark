# THE "MY WORKLOAD" dbt PROJECT, vendored from djouallah/fabric-dbt-examples (dbt1/, see SOURCE)
# and cut down to the Iceberg legs bench can run on its own engines and its own auth:
#
#   duckdb   dbt-duckdb, ATTACHed to the OneLake Iceberg REST catalog   (the source's `iceberg`)
#   polars   dbt-polars, pyiceberg REST catalog (+ an Azure storage catalog over the landing)
#   gluten   dbt-spark `method: session` on Spark + Gluten/Velox, Iceberg (port of the Delta `spark`)
#   trino    dbt-trino on bench's Trino container, Iceberg (ported from the gluten tree)
#
# ONE PROJECT, ONE TREE PER ENGINE: models/aemo/<engine>/<layer>/<model>.sql. Exactly one tree
# is +enabled per run, keyed on target.name, so the same model names never collide. There is
# no --select anywhere. A target name that matches no folder disables everything and
# `dbt build` exits 0 having built nothing -- workload_run_engine.py refuses a run with no models.
#
# ONE MATERIALIZATION PER MODEL, ON EVERY ENGINE: an incremental merge on the model's natural key,
# update on match. A merge commits against the snapshot it read, so two concurrent runs folding the
# same file cannot both insert it (the loser's commit fails); an append would keep both. Scratch
# relations (Spark's stage, Trino's __dbt_tmp) carry the run's id.
# The merge reads only the target rows the batch can match: macros/merge_prune.sql adds
# `DEST.file IN (<this batch's files>)` (`date` on fct_summary) to the ON clause, as literals Iceberg
# prunes on, so the target scan stays the size of the batch, not of the table.
#
# THE LANDED FILES ARE SOURCES, NOT MODELS (models/sources.yml): read where they land, copied by
# nothing, on every engine.
#
# Nothing on the `aemo_electricity` project key, ever: a generic test declared in a patch file
# gets the fqn of the YML file, so a project-key gate also disables every generic test.

name: 'aemo_electricity'
version: '1.0.0'
profile: 'aemo_electricity'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

on-run-start:
  # DuckDB's azure extension needs the curl transport on a Linux runner (bench/config.py,
  # azure_transport). Set here, not in profiles.yml `settings:`: dbt-duckdb re-applies settings
  # on every cursor and DuckDB refuses to switch temp_directory once anything has spilled.
  - "{% if target.type == 'duckdb' and env_var('AZURE_TRANSPORT_OPTION_TYPE', 'default') != 'default' %}SET GLOBAL azure_transport_option_type = '{{ env_var('AZURE_TRANSPORT_OPTION_TYPE') }}'{% endif %}"
  - "{% if target.type == 'duckdb' %}SET GLOBAL temp_directory = '{{ env_var('DUCKDB_TEMP_DIR', '/tmp/duckdb_spill') }}'{% endif %}"
  # Spark's view of the archive log source (models/sources.yml): a GLOBAL temp view, because a
  # source renders schema-qualified and global_temp is the one schema a temp view lives in. Not
  # parquet.`<path>`: with the OneLake catalog as default, Spark asks it for a table named after the
  # path and OneLake answers 400 instead of "no such table".
  - "{% if target.type == 'spark' %}CREATE OR REPLACE GLOBAL TEMPORARY VIEW csv_raw_archive_log USING parquet OPTIONS (path '{{ get_archive_log_path() }}'){% endif %}"

models:
  aemo_electricity:
    aemo:
      # Materialization and file_format are set in every model file. The patch files
      # (_staging.yml, _dimensions.yml, _marts.yml) sit one level above these keys so one patch
      # documents and tests whichever tree is enabled.
      duckdb:
        +enabled: "{{ target.name == 'duckdb' }}"
        dimensions: {+schema: mart}
        marts:      {+schema: landing}
      polars:
        +enabled: "{{ target.name == 'polars' }}"
        dimensions: {+schema: mart}
        marts:      {+schema: landing}
      gluten:
        +enabled: "{{ target.name == 'gluten' }}"
        +file_format: iceberg
        dimensions: {+schema: mart}
        marts:      {+schema: landing}
      trino:
        +enabled: "{{ target.name == 'trino' }}"
        # NO VIEWS AND NO RENAME. dbt-trino stages an incremental's source as a view, and builds a
        # table under a temporary name and renames it; the OneLake catalog has no CREATE VIEW, so
        # the staging relation is a table, and a rebuilt table is dropped and created in place.
        +views_enabled: false
        +on_table_exists: drop
        dimensions: {+schema: mart}
        marts:      {+schema: landing}

data_tests:
  aemo_electricity:
    aemo:
      # NOT an asymmetry to "fix": the generic tests in models/aemo/_*.yml have no engine
      # segment in their fqn, so they must stay ungated here and run on every engine. The
      # singular tests under tests/aemo/<engine>/ do have one, and are gated on it.
      duckdb: {+enabled: "{{ target.name == 'duckdb' }}"}
      polars: {+enabled: "{{ target.name == 'polars' }}"}
      gluten: {+enabled: "{{ target.name == 'gluten' }}"}
      trino:  {+enabled: "{{ target.name == 'trino' }}"}

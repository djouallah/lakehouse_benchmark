# Every credential comes from the environment, set by .github/scripts/workload_run_engine.py from
# bench.auth (GitHub OIDC -> Entra): ONELAKE_TOKEN is a storage bearer, WAREHOUSE_PATH is
# <workspace>/<lakehouse>, FILES_PATH the landing zone under that lakehouse's Files/.
aemo_electricity:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: ':memory:'
      database: onelake
      schema: mart
      # One model at a time: two fact batches side by side doubled the memory.
      threads: 1
      settings:
        preserve_insertion_order: false
      # At connect, once. memory_limit: a fixed cap, so DuckDB spills instead of growing toward
      # its default 80% of RAM, which left no room for the rest of the process (the runner died at
      # 100 files a run, 39382816547). temp_directory: /mnt, the runner's second disk.
      config_options:
        temp_directory: "{{ env_var('DUCKDB_TEMP_DIR', '/tmp/duckdb_spill') }}"
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '9GB') }}"
      # The catalog bearer covers Tables/; Files/, the landing zone every model reads, needs this.
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: onelake
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo

    polars:
      type: polars
      database: onelake
      schema: mart
      threads: 1
      catalogs:
        - name: onelake
          type: iceberg
          schema: mart
          pyiceberg_type: rest
          uri: "{{ env_var('ONELAKE_ENDPOINT') }}"
          warehouse: "{{ env_var('WAREHOUSE_PATH') }}"
          adls.account-name: onelake
          adls.account-host: onelake.blob.fabric.microsoft.com
          token: "{{ env_var('ONELAKE_TOKEN') }}"
          adls.token: "{{ env_var('ONELAKE_TOKEN') }}"
        # The landing files, for sources' external.location (models/sources.yml): OneLake's blob
        # endpoint, the workspace as the container, the lakehouse's Files/dbt as the root.
        - name: landing
          type: azure
          schema: landing
          account_name: onelake
          container: "{{ env_var('FILES_CONTAINER') }}"
          prefix: "{{ env_var('FILES_PREFIX') }}"
          credentials:
            storage_options:
              use_fabric_endpoint: "true"
              bearer_token: "{{ env_var('ONELAKE_TOKEN') }}"

    # The SparkSession is built BEFORE dbt starts (workload_run_engine.py: bench's Gluten session,
    # Iceberg REST catalog `onelake` as spark.sql.defaultCatalog); `method: session` picks it up
    # with getOrCreate().
    gluten:
      type: spark
      method: session
      host: localhost
      schema: mart
      threads: 1

    # The Trino container bench/trino.py runs, with the OneLake REST catalog `onelake` already
    # attached by workload_run_engine.py (the bearer is the catalog's, not the profile's) and the
    # Hive catalog `files` over the landing zone. Extended statistics off: OneLake refuses a
    # commit that carries Puffin statistics with 400 Malformed request (bench/etl/engines/
    # trino_iceberg.py).
    trino:
      type: trino
      method: none
      user: bench
      host: 127.0.0.1
      port: 8080
      http_scheme: http
      database: onelake
      schema: mart
      threads: 1
      session_properties:
        onelake.collect_extended_statistics_on_write: false

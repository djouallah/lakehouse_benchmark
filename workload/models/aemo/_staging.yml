version: 2

# Shared across all five engines. The model names are identical in models/aemo/duckrun,
# /iceberg, /ducklake, /spark and /polars, and exactly one of those trees is +enabled per run,
# so ONE patch file documents and tests whichever tree is live. These files must stay at
# models/aemo/ — one level above the engine folders — because that is the folder segment
# dbt_project.yml's data_tests block gates on.

models:
  - name: stg_csv_archive_log
    config:
      meta:
        differences:
          - "The one model built differently, and a limitation: on DuckDB it is a view in its in-memory catalog, because dbt-duckdb builds a table through a rename and the OneLake Iceberg catalog has no `CREATE VIEW`. The other engines rebuild a table every run."
          - "Reading the parquet log: `read_parquet()` on DuckDB and Polars; a `USING parquet` temp view on Spark (for `parquet.`path``, OneLake answers the catalog lookup with 400); a Hive external table on Trino."
    description: >
      One row per source file landed by download_aemo.py, read from
      csv_raw_archive_log.parquet. Every engine reads the SAME parquet file, which is what
      makes the fact models' file-selection logic identical across engines.
    columns:
      - name: source_filename
        description: Name of the downloaded file (no extension)
        tests:
          - not_null
      - name: source_type
        description: Which AEMO feed the file came from
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['daily', 'scada_today', 'price_today', 'duid_data', 'duid_facilities', 'duid_wa_energy', 'duid_geo_data']
      - name: csv_filename
        description: >
          The CSV filename without extension, as extracted from the ZIP. This is what the
          fact models store in [file], so it is the column the incremental file-selection
          dedups on.
        tests:
          - not_null
      - name: archived_at
        description: When the file was landed
        tests:
          - not_null

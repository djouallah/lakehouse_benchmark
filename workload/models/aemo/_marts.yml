version: 2

models:
  - name: fct_price
    config:
      meta:
        differences:
          - "Reading this run's CSVs: `read_csv()` over the file list on DuckDB (a `SET VARIABLE` pre-hook) and Polars (picked at parse time: dbt-polars has no hooks); a csv temp view staged into an Iceberg table on Spark (`MERGE` refuses the non-deterministic `input_file_name()`); a Hive external table on Trino, files picked on `\"$path\"`, `NULLIF` for Hive's empty strings."
          - "Incremental: an insert-only `merge` on DuckDB (`do_nothing`), an `append` of unprocessed files on Polars (no `merge_clauses`, [dbt-polars#32](https://github.com/datamindedbe/incubator-dbt-polars/issues/32)), an updating `merge` on Spark and Trino."
          - "Timestamps: `CAST(... AS TIMESTAMPTZ)` on DuckDB and Polars; `to_timestamp(..., 'yyyy/MM/dd HH:mm:ss')` on Spark, whose `CAST` returns NULL for the slashes; `date_parse()` on Trino."
    description: AEMO DREGION record from the daily archive files — all 130 source columns.
    columns:
      - name: REGIONID
        description: NEM region (plus WA1 for the WA market)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
        tests:
          - not_null
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: INTERVENTION
        description: AEMO intervention flag (0 = normal dispatch run)
      - name: month_key
        description: YYYYMM partition key derived from SETTLEMENTDATE
      - name: file
        # 'file' is a reserved word in T-SQL. quote: true makes dbt bracket it in the
        # generated tests, which is harmless on the other four engines — the one place a
        # shared patch file bends to a dialect.
        quote: true
        description: Source CSV filename the row came from; part of the merge key
        tests:
          - not_null

  - name: fct_scada
    config:
      meta:
        differences:
          - "Reading this run's CSVs: `read_csv()` over the file list on DuckDB (a `SET VARIABLE` pre-hook) and Polars (picked at parse time: dbt-polars has no hooks); a csv temp view staged into an Iceberg table on Spark (`MERGE` refuses the non-deterministic `input_file_name()`); a Hive external table on Trino, files picked on `\"$path\"`, `NULLIF` for Hive's empty strings."
          - "Incremental: an insert-only `merge` on DuckDB (`do_nothing`), an `append` of unprocessed files on Polars (no `merge_clauses`, [dbt-polars#32](https://github.com/datamindedbe/incubator-dbt-polars/issues/32)), an updating `merge` on Spark and Trino."
          - "Timestamps: `CAST(... AS TIMESTAMPTZ)` on DuckDB and Polars; `to_timestamp(..., 'yyyy/MM/dd HH:mm:ss')` on Spark, whose `CAST` returns NULL for the slashes; `date_parse()` on Trino."
    description: AEMO DUNIT record from the daily archive files — all 53 source columns.
    columns:
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_duid')
                field: DUID
              config:
                severity: warn
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
        tests:
          - not_null
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW)
      - name: month_key
        description: YYYYMM partition key derived from SETTLEMENTDATE
      - name: file
        quote: true
        description: Source CSV filename the row came from; part of the merge key
        tests:
          - not_null

  - name: fct_price_today
    config:
      meta:
        differences:
          - "Reading this run's CSVs: `read_csv()` over the file list on DuckDB (a `SET VARIABLE` pre-hook) and Polars (picked at parse time: dbt-polars has no hooks); a csv temp view staged into an Iceberg table on Spark (`MERGE` refuses the non-deterministic `input_file_name()`); a Hive external table on Trino, files picked on `\"$path\"`, `NULLIF` for Hive's empty strings."
          - "Incremental: an insert-only `merge` on DuckDB (`do_nothing`), an `append` of unprocessed files on Polars (no `merge_clauses`, [dbt-polars#32](https://github.com/datamindedbe/incubator-dbt-polars/issues/32)), an updating `merge` on Spark and Trino."
          - "Timestamps: `CAST(... AS TIMESTAMPTZ)` on DuckDB and Polars; `to_timestamp(..., 'yyyy/MM/dd HH:mm:ss')` on Spark, whose `CAST` returns NULL for the slashes; `date_parse()` on Trino."
    description: Intraday DISPATCHIS regional prices, landed every 5 minutes.
    columns:
      - name: REGIONID
        description: NEM region (plus WA1 for the WA market)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
        tests:
          - not_null
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: file
        quote: true
        description: Source CSV filename the row came from; part of the merge key
        tests:
          - not_null

  - name: fct_scada_today
    config:
      meta:
        differences:
          - "Reading this run's CSVs: `read_csv()` over the file list on DuckDB (a `SET VARIABLE` pre-hook) and Polars (picked at parse time: dbt-polars has no hooks); a csv temp view staged into an Iceberg table on Spark (`MERGE` refuses the non-deterministic `input_file_name()`); a Hive external table on Trino, files picked on `\"$path\"`, `NULLIF` for Hive's empty strings."
          - "Incremental: an insert-only `merge` on DuckDB (`do_nothing`), an `append` of unprocessed files on Polars (no `merge_clauses`, [dbt-polars#32](https://github.com/datamindedbe/incubator-dbt-polars/issues/32)), an updating `merge` on Spark and Trino."
          - "Timestamps: `CAST(... AS TIMESTAMPTZ)` on DuckDB and Polars; `to_timestamp(..., 'yyyy/MM/dd HH:mm:ss')` on Spark, whose `CAST` returns NULL for the slashes; `date_parse()` on Trino."
          - "`SCADAVALUE <> 0` needs a cast first: Spark compares a string with 0 as an INT, which dropped every reading between -1 and 1."
    description: Intraday DISPATCHSCADA readings per unit, landed every 5 minutes.
    columns:
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_duid')
                field: DUID
              config:
                severity: warn
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp
        tests:
          - not_null
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW)
      - name: file
        quote: true
        description: Source CSV filename the row came from; part of the merge key
        tests:
          - not_null

  - name: fct_summary
    config:
      meta:
        differences:
          - "`GROUP BY ALL` on DuckDB, Polars and Spark; `GROUP BY 1, 2, 3` on Trino, where `GROUP BY ALL` means something else."
          - "The interval's time: `strftime` on DuckDB and Polars, `date_format` on Spark, `format_datetime` on Trino; the 6-day window: `INTERVAL`, `date_sub`, `date_add`."
          - "`DOUBLE` to `DECIMAL(18,4)` breaks ties differently: DuckDB and Polars land 0.0001 off Spark on some rows ([polars#30074](https://github.com/pola-rs/polars/issues/30074), [duckdb#27503](https://github.com/duckdb/duckdb/issues/27503)); Trino matches Spark."
          - "Merge on (date, time, DUID) on every engine."
    description: >
      THE GOLD TABLE, and the one every engine is compared on. One row per
      (date, time, DUID) joining generation (mw) to the matching regional price. Rebuilt
      from the daily facts when new daily files land, topped up from the intraday facts in
      between. parity.py compares this table across engines.
    columns:
      - name: date
        description: Calendar date of the dispatch interval
        tests:
          - not_null
      - name: time
        description: Time of day as an HHMM integer, 5-minute grain
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_duid')
                field: DUID
      - name: mw
        description: Generation for the interval (MW), DECIMAL(18,4)
        tests:
          - not_null
      - name: price
        description: Regional Reference Price matched via the unit's region ($/MWh), DECIMAL(18,4)
        tests:
          - not_null
      - name: cutoff
        description: >
          High-water mark (max SETTLEMENTDATE seen when the batch was written), used by the
          intraday top-up branch to know where to resume.

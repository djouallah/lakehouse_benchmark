version: 2

# THE FILES THE PROJECT READS, declared as dbt sources: nothing in the project copies them.
# download_aemo (bench/workload/landing.py) lands them in Files/dbt; each engine reads them where
# they are, and `{{ source(...) }}` compiles to that read:
#
#   duckdb  dbt-duckdb's meta.external_location: read_parquet('<Files/dbt>/...parquet')
#   trino   the Hive EXTERNAL table the runner declares over the file, files.dbt.archive_log
#   gluten  a global temp view over the file, registered at run start (on-run-start)
#   polars  dbt-polars' external.location, read through `landing`, the Azure storage catalog
#           the profile declares over Files/dbt (a source's database names its catalog)

sources:
  - name: landing
    description: >
      The landing zone in Files/dbt, written by download_aemo before every run and read where
      it is.
    database: "{{ 'files' if target.type == 'trino' else 'global_temp' if target.type == 'spark' else 'landing' if target.type == 'polars' else target.database }}"
    schema: "{{ 'dbt' if target.type == 'trino' else 'global_temp' if target.type == 'spark' else 'landing' }}"
    tables:
      - name: csv_raw_archive_log
        identifier: "{{ 'archive_log' if target.type == 'trino' else 'csv_raw_archive_log' }}"
        description: >
          One row per source file landed by download_aemo, the parquet beside the CSVs. Every
          engine reads the SAME file, which is what makes the fact models' file selection
          identical across engines.
        # dbt-polars: a path relative to its `landing` catalog's root. The other adapters
        # ignore it.
        external:
          location: csv_raw_archive_log.parquet
        config:
          file_format: parquet
          meta:
            external_location: "read_parquet('{{ env_var('FILES_PATH', '') }}/csv_raw_archive_log.parquet')"
            differences:
              - "A dbt source on every engine, read where it lands: no model copies it. `source()` compiles to `read_parquet()` on DuckDB (dbt-duckdb's `external_location`), a scan of `external.location` through an Azure storage catalog over OneLake Files on Polars, the Hive external table on Trino, and a global temp view registered at run start on Spark."
        columns:
          - name: source_filename
            data_tests: [not_null]
          - name: source_type
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['daily', 'scada_today', 'price_today', 'duid_data', 'duid_facilities', 'duid_wa_energy', 'duid_geo_data']
          - name: csv_filename
            data_tests: [not_null]

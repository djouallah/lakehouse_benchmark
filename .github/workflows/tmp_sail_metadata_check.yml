name: temporary sail metadata check

# TEMPORARY, READ-ONLY: .github/scripts/tmp/sail_metadata_check.py. Why DuckDB 2.0.1 refuses the
# Sail leg's Iceberg tables with a negative 'last-partition-id' (table maintenance since
# 2026-11-20): the REST loadTable answer against the stored metadata files. Writes nothing. In the
# workload queue so it reads between two builds. Deleted once the cause is reported.

on:
  workflow_dispatch:

concurrency:
  group: workload
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install azure-identity
      - run: python .github/scripts/tmp/sail_metadata_check.py

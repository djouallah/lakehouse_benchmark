# TEMPORARY: minimal repro for a pandas read_csv(engine="pyarrow") issue. Deleted after use.
name: tmp pandas repro
on: workflow_dispatch
jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [release, nightly]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.build == 'release'
        run: pip install -q pandas pyarrow
      - if: matrix.build == 'nightly'
        run: pip install -q --pre --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple pandas pyarrow
      - run: |
          cat > repro.py <<'PY'
          import io
          import pandas as pd
          import pyarrow as pa

          print("pandas", pd.__version__, "pyarrow", pa.__version__)
          data = "a,b\n1,2,3,4\n"
          names = ["w", "x", "y", "z"]

          print("--- engine='c'")
          print(pd.read_csv(io.StringIO(data), header=None, names=names))

          for kwargs in ({}, {"on_bad_lines": "skip"}):
              print(f"--- engine='pyarrow' {kwargs}")
              try:
                  print(pd.read_csv(io.StringIO(data), header=None, names=names, engine="pyarrow", **kwargs))
              except Exception as exc:
                  print(f"{type(exc).__name__}: {exc}")
          PY
          python repro.py

name: temporary iceberg-go CLI repro

# TEMPORARY, read-only: the apache/iceberg-go `iceberg` CLI against OneLake (describe, files,
# compact analyze, clean-orphan-files --dry-run on one workload table), to get the exact error
# before reporting it. Main only: the OIDC trust is main. Deleted once reported.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: apache/iceberg-go commit
        type: string
        default: b7792e9e8799

permissions:
  contents: read
  id-token: write

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: |
          git clone -q https://github.com/apache/iceberg-go "$RUNNER_TEMP/igo"
          cd "$RUNNER_TEMP/igo" && git checkout -q ${{ inputs.ref }} && git log -1 --format='%H %cd'
          go build -o "$RUNNER_TEMP/iceberg" ./cmd/iceberg
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: CLI against OneLake
        env:
          WAREHOUSE: ${{ secrets.FABRIC_WORKSPACE_ID }}/${{ secrets.FABRIC_LAKEHOUSE_ID }}
        shell: bash
        run: |
          TOK=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$TOK"
          ice() { echo "+ iceberg $*"; "$RUNNER_TEMP/iceberg" --uri https://onelake.table.fabric.microsoft.com/iceberg \
            --token "$TOK" --warehouse "$WAREHOUSE" "$@" 2>&1 | head -25; echo; }
          ice --help | head -5
          ice describe table dbt_trino_mart.fct_summary
          ice files dbt_trino_mart.fct_summary
          ice compact analyze dbt_trino_mart.fct_summary
          ice clean-orphan-files --dry-run dbt_trino_mart.fct_summary

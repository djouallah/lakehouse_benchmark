name: temporary iceberg-go diagnostic

# TEMPORARY, never commits to a table: .github/scripts/tmp/igo_diag measures memory while
# rewriting dbt_polars_landing.fct_scada's first compaction groups (files written, not committed:
# orphans for the next maintenance), and prints a Gluten data file's Parquet schema. Main only:
# the OIDC trust is main. Deleted once answered.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - working-directory: .github/scripts/tmp/igo_diag
        run: |
          go mod init diag
          go get github.com/apache/iceberg-go@b7792e9e8799
          go mod tidy
          go build -o diag .
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Diagnose
        env:
          WAREHOUSE: ${{ secrets.FABRIC_WORKSPACE_ID }}/${{ secrets.FABRIC_LAKEHOUSE_ID }}
        shell: bash
        run: |
          export ONELAKE_TOKEN=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$ONELAKE_TOKEN"
          .github/scripts/tmp/igo_diag/diag 2>&1 \
            | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

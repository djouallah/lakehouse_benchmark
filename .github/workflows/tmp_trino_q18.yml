# TEMPORARY: TPC-H SF=100 Q18 on the bench's Trino, more build partitions. Deleted after.
name: tmp trino q18
on: workflow_dispatch

concurrency:
  group: onelake
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  q18:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      BENCH_SUITE: tpch
      TPCH_SF: "100"
      BENCH_ENGINE: trino_iceberg
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements/trino_iceberg.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: docker pull "$(python -c 'from bench.trino import IMAGE; print(IMAGE)')"
      - name: Q18, task_concurrency 16 then 32
        run: |
          python - <<'PY'
          import time
          from bench import scrub, trino
          from bench.suite import suite_class
          from bench.tpch import queries
          from bench.tpch.engines.trino_iceberg import TrinoIceberg

          cfg = suite_class().from_env()
          engine = TrinoIceberg(cfg)
          engine.setup()
          q18 = queries.load("trino_iceberg", cfg.schema, cfg.sf)[17]
          for label, setting in (("task_concurrency 16", 16), ("task_concurrency 32", 32)):
              trino.sql(engine._conn, f"SET SESSION task_concurrency = {setting}")
              plan = trino.sql(engine._conn, f"EXPLAIN (TYPE DISTRIBUTED) {q18}")[0][0]
              joins = [l.strip() for l in plan.splitlines() if "Join[" in l or "SemiJoin" in l or "LocalExchange" in l]
              print(f"== {label}: joins/exchanges in plan", flush=True)
              for line in joins:
                  print("   ", line[:200], flush=True)
              started = time.perf_counter()
              try:
                  rows = engine.execute(q18)
                  print(f"== {label}: Q18 ok {rows} rows in {time.perf_counter() - started:.1f}s", flush=True)
              except Exception as exc:
                  print(f"== {label}: Q18 FAILED after {time.perf_counter() - started:.1f}s: {scrub.scrub_exc(exc, 600)}", flush=True)
          engine.close()
          PY
      - name: Trino server log
        if: always()
        run: |
          docker logs trino 2>&1 | grep -iE "spill|revok|OutOfMemory|Terminating" | tail -n 40 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

name: tmp databend repro

# TEMPORARY. Minimal reproduction for an upstream report: a UNION ALL over two parquet sources with
# different schemas fails with TableSchemaMismatch (TPC-DS Q2/Q5/Q14... on Iceberg tables, run
# 39024841127; on fs:// views, run 39021775503). Runs on the stock v1.2.952-nightly and on our build
# of main (with databend#20594) to see whether it is new. Delete once filed.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - datafuselabs/databend:v1.2.952-nightly
          - ghcr.io/djouallah/databend:main-8b1dc20714
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyarrow pymysql
      - name: Two parquet files with different schemas
        run: |
          mkdir -p /tmp/r && chmod 777 /tmp/r
          python - <<'EOF'
          import pyarrow as pa, pyarrow.parquet as pq
          pq.write_table(pa.table({"a": [1, 2], "b": ["x", "y"]}), "/tmp/r/t1.parquet")
          pq.write_table(pa.table({"c": [3], "d": ["z"], "e": [1.5]}), "/tmp/r/t2.parquet")
          EOF
      - name: Databend
        run: |
          docker run -d --name databend -v /tmp/r:/r:ro -e STORAGE_ALLOW_INSECURE=true \
            -e QUERY_DEFAULT_USER=databend -e QUERY_DEFAULT_PASSWORD=databend \
            -p 127.0.0.1:3307:3307 "${{ matrix.image }}"
      - name: Queries
        run: |
          python - <<'EOF'
          import time, pymysql
          for _ in range(60):
              try:
                  conn = pymysql.connect(host="127.0.0.1", port=3307, user="databend", password="databend", autocommit=True)
                  break
              except Exception:
                  time.sleep(2)
          cur = conn.cursor()
          cur.execute("SELECT version()"); print("version:", cur.fetchone()[0])
          loc = lambda n: f"'fs:///r/{n}.parquet' (FILE_FORMAT => 'parquet')"
          for sql in [
              f"CREATE OR REPLACE VIEW v1 AS SELECT * FROM {loc('t1')}",
              f"CREATE OR REPLACE VIEW v2 AS SELECT * FROM {loc('t2')}",
              "SELECT a FROM v1",
              "SELECT c FROM v2",
              "SELECT a FROM v1 UNION ALL SELECT c FROM v2",
              f"SELECT a FROM {loc('t1')} UNION ALL SELECT c FROM {loc('t2')}",
              f"SELECT count(*) FROM (SELECT a FROM {loc('t1')}) x, (SELECT c FROM {loc('t2')}) y",
          ]:
              try:
                  cur.execute(sql); rows = cur.fetchall()
                  print(f"OK    {sql}\n      -> {rows}")
              except Exception as exc:
                  print(f"FAIL  {sql}\n      -> {exc}")
          EOF

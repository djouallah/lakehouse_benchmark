# TEMPORARY: build Trino from djouallah/trino master (no release carries
# iceberg.rest-catalog.server-assigned-table-location-enabled yet; 483 predates it) and run the
# candidate probe on it. Deleted once the result is in.
name: tmp trino master

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
        with:
          repository: djouallah/trino
          ref: master
          path: trino
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # EVERYTHING, not `-pl core/trino-server -am`: the server's provisio assembly bundles every
      # plugin without depending on it, so -am built none and the assembly could not resolve them.
      # Trino CI's own fast install (MAVEN_FAST_INSTALL), minus the docs.
      - name: Build Trino (no tests)
        working-directory: trino
        run: |
          ./mvnw -B -V --no-transfer-progress -T 1C install -DskipTests -Dmaven.source.skip=true \
            -Dair.check.skip-all -Dmaven.javadoc.skip=true -pl '!:trino-docs'
          df -h /
      - name: Build the image (amd64)
        working-directory: trino
        run: core/docker/build.sh -a amd64 -x
      - id: push
        name: Push to GHCR
        working-directory: trino
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout --raw-streams)
          sha=$(git rev-parse --short HEAD)
          image="ghcr.io/djouallah/trino:${version}-${sha}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "trino:${version}-amd64" "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "pushed $image"

  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The shared lakehouse queue, as candidate_engine.yml.
    concurrency:
      group: onelake
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      BENCH_SUITE: tpch
      TPCH_SF: "10"
      CANDIDATE_IMAGE: ${{ needs.build.outputs.image }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements/catalog.txt -r requirements/candidate.txt
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$CANDIDATE_IMAGE"
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/candidate_engine.py trino
      - name: Candidate server log
        if: always()
        run: |
          docker logs candidate 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

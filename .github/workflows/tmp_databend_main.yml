name: tmp databend main

# TEMPORARY. Builds databend-query from databendlabs/databend main, which has the Iceberg decimal fix
# (databend#20594, closes #20588) that no nightly image carries yet, then runs the candidate probe on
# the stock nightly image with that binary swapped in. Delete once v1.2.953-nightly ships.
#
# DATABEND_RELEASE_VERSION: the build refuses to guess a version without git tags, and the query
# must handshake with the image's v1.2.952 databend-meta.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch of databendlabs/databend to build.
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/target && sudo chmod 777 /mnt/target
          df -h / /mnt
      # rustc on the databend_query crate outgrows the runner's 16 GB (SIGKILL, run 39004627157).
      - name: Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 28G /swapfile-build && sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build && sudo swapon /swapfile-build
          free -h
      - uses: actions/checkout@v5
        with:
          repository: databendlabs/databend
          ref: ${{ inputs.ref }}
          path: databend
      - run: git -C databend log -1 --format='databend %H %cs %s'
      # Databend's own build image (clang + mold + protoc + the pinned nightly toolchain).
      # Release, but no LTO and parallel codegen: this binary is for a correctness gate.
      - name: Build databend-query
        run: |
          docker run --rm -v "$PWD/databend:/workspace" -v /mnt/target:/target -w /workspace \
            -e CARGO_TARGET_DIR=/target -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always \
            -e CARGO_PROFILE_RELEASE_DEBUG=0 -e CARGO_PROFILE_RELEASE_LTO=off \
            -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 -e CARGO_PROFILE_RELEASE_OPT_LEVEL=2 \
            -e DATABEND_RELEASE_VERSION=v1.2.952-nightly \
            -e RUSTFLAGS="-C target-feature=+sse4.2 -C link-arg=-fuse-ld=mold" \
            datafuselabs/build-tool:debian-nightly-2026-08-28 \
            bash -c "cargo build --release --bin databend-query && strip /target/release/databend-query"
          ls -lh /mnt/target/release/databend-query
      - uses: actions/upload-artifact@v4
        with:
          name: databend-query
          path: /mnt/target/release/databend-query
          retention-days: 3

  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The shared lakehouse queue, as candidate_engine.yml.
    concurrency:
      group: onelake
      cancel-in-progress: false
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      BENCH_SUITE: tpch
      TPCH_SF: "10"
      CANDIDATE_IMAGE: databend-main:local
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: databend-query
          path: fix
      - name: Image with the main binary
        run: |
          chmod +x fix/databend-query
          printf 'FROM datafuselabs/databend:v1.2.952-nightly\nCOPY databend-query /usr/bin/databend-query\n' > fix/Dockerfile
          docker build -t databend-main:local fix
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/catalog.txt
            requirements/candidate.txt
      - run: pip install -r requirements/catalog.txt -r requirements/candidate.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/candidate_engine.py databend
      - name: Candidate server log
        if: always()
        run: |
          for c in $(docker ps -a --format '{{.Names}}'); do echo "=== $c"; docker logs "$c" 2>&1 | tail -n 300; done \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

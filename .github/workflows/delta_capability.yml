name: delta support

# WHAT EACH ENGINE CAN DO writing Delta tables into OneLake, in SQL: the site's Delta support tab.
#
#   plan  ->  ask (one job per client, one at a time)  ->  publish (only when asked)
#
# capability.yml's twin, on Delta. Each client's probe script (delta_capability_<client>.py, all
# on delta_probe.py) writes its tables by path under Tables/_bench_delta, sends one operation per
# probe through the engine, and checks the effect through delta-rs and the _delta_log.
#
# `publish` is the SINGLE WRITER of results/delta/ and docs/data/delta.json. results/delta/ keeps
# each client's latest reading, so a run that asks one client leaves the others' cells as they
# were. It runs only with `publish` ticked.

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Which clients to ask.
        type: choice
        options:
          - spark,sail,trino,duckdb
          - spark
          - sail
          - trino
          - duckdb
        default: spark,sail,trino,duckdb
      keep:
        description: Leave the probe tables behind, to inspect them in Fabric.
        type: boolean
        default: false
      probes:
        description: >-
          Probe keys to ask, comma-separated (e.g. merge_upsert,vacuum). Empty asks them all. A
          client's other readings stay as they are.
        type: string
        default: ""
      publish:
        description: Publish the readings to results/delta/ and the site.
        type: boolean
        default: false

# The same group as capability.yml, tpcds.yml and etl.yml: one lakehouse, one OneLake pipe.
concurrency:
  group: onelake
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clients: ${{ steps.plan.outputs.clients }}
    steps:
      - id: plan
        run: |
          CLIENTS=$(printf '%s' "${{ inputs.clients || 'spark,sail,trino,duckdb' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "clients=$CLIENTS" >> "$GITHUB_OUTPUT"
          echo "clients: $CLIENTS"

  ask:
    needs: plan
    name: >-
      ${{ matrix.client == 'spark' && 'Spark'
      || matrix.client == 'sail' && 'LakeSail'
      || matrix.client == 'trino' && 'Trino'
      || matrix.client == 'duckdb' && 'DuckDB'
      || matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      # One client's failure must not delete the others' answers.
      fail-fast: false
      max-parallel: 1
      matrix:
        client: ${{ fromJSON(needs.plan.outputs.clients) }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SPARK_DRIVER_MEMORY: 11g
      CAPABILITY_KEEP: ${{ inputs.keep && '1' || '0' }}
      CAPABILITY_PROBES: ${{ inputs.probes }}
      RESULTS_FILE: results/delta/${{ matrix.client }}.json
      REQS: requirements/capability_delta_${{ matrix.client }}.txt
      SCRIPT: .github/scripts/capability/delta_capability_${{ matrix.client }}.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install ${{ matrix.client }}
        run: |
          pip install -r "$REQS"
          pip list --format=freeze | grep -Ei '^(deltalake|pyarrow|pysail|pyspark|trino)=' || true

      - uses: actions/setup-java@v5
        if: matrix.client == 'spark'
        with:
          distribution: temurin
          java-version: "17"

      # spark.jars.packages resolves delta-spark and hadoop-azure at every SparkSession start.
      - uses: actions/cache@v4
        if: matrix.client == 'spark'
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark42-delta441-azure350-v1

      - name: Pull the Trino image
        if: matrix.client == 'trino'
        run: docker pull "$(python -c 'from bench.trino import IMAGE; print(IMAGE)')"

      # The same pinned CLI as the Iceberg grid (capability.yml says why this run).
      - name: DuckDB CLI
        if: matrix.client == 'duckdb'
        uses: ./.github/actions/duckdb-cli
        with:
          run-id: "44520268851"

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Probe ${{ matrix.client }}
        # `shell: bash` is pipefail. Without it `... | tee` exits 0 whatever the script did.
        shell: bash
        run: python "$SCRIPT" 2>&1 | tee "delta-${{ matrix.client }}.log"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: delta-${{ matrix.client }}
          path: |
            delta-${{ matrix.client }}.log
            results/delta/${{ matrix.client }}.json
          if-no-files-found: warn

  publish:
    needs: ask
    # !cancelled(), not always(): a cancelled run publishes nothing (see etl.yml's publish).
    if: ${{ !cancelled() && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v6
        with:
          pattern: delta-*
          merge-multiple: true
          path: parts

      - name: Write the site's grid
        run: |
          mkdir -p results/delta
          cp parts/results/delta/*.json results/delta/ 2>/dev/null || true
          python .github/scripts/capability/render_delta.py
          python .github/scripts/capability_publish.py docs/data/delta.json

      - name: Commit results and the grid
        # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE: the rule etl.yml's publish states.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add results/delta docs/data/delta.json
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "delta support: readings from run ${{ github.run_id }}"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p results/delta
            cp parts/results/delta/*.json results/delta/ 2>/dev/null || true
            python .github/scripts/capability/render_delta.py
            python .github/scripts/capability_publish.py docs/data/delta.json
          done
          echo "::error::could not push after 3 attempts"
          exit 1

name: databend build

# The Databend engine's binary, until a nightly image carries the Iceberg decimal fix (databend#20594,
# closes #20588; v1.2.952-nightly does not). Builds databend-query from databendlabs/databend at `ref`
# with Databend's own release profile (thin LTO, codegen-units 1: the binary the bench times must be the
# one they ship, not a quick build) and keeps it as this run's artifact; databend_image.yml copies it
# into the stock nightly image in this repo's GHCR, where bench/databend.py pulls it. Once a nightly has
# the fix, bench/databend.py points at that image and both files go.
#
# DATABEND_RELEASE_VERSION: the build refuses to guess a version without git tags, and the query must
# handshake with the base image's databend-meta.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: databendlabs/databend commit (full SHA) to build.
        type: string
        default: 8b1dc20714e2fb2e63f5ee23bfb06bf3c07e205c
      base:
        description: Nightly image the binary goes into; its version is the build's.
        type: string
        default: v1.2.952-nightly

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/target && sudo chmod 777 /mnt/target
          df -h / /mnt
      # rustc on the databend_query crate outgrows the runner's 16 GB (SIGKILL, run 39004627157).
      - name: Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 28G /swapfile-build && sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build && sudo swapon /swapfile-build
          free -h
      - uses: actions/checkout@v5
        with:
          repository: databendlabs/databend
          ref: ${{ inputs.ref }}
          path: databend
      - run: git -C databend log -1 --format='databend %H %cs %s'
      # Databend's own build image (clang + mold + protoc + the pinned nightly toolchain).
      - name: Build databend-query
        run: |
          docker run --rm -v "$PWD/databend:/workspace" -v /mnt/target:/target -w /workspace \
            -e CARGO_TARGET_DIR=/target -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always \
            -e DATABEND_RELEASE_VERSION=${{ inputs.base }} \
            -e RUSTFLAGS="-C target-feature=+sse4.2 -C link-arg=-fuse-ld=mold" \
            datafuselabs/build-tool:debian-nightly-2026-08-28 \
            bash -c "cargo build --release --bin databend-query && strip /target/release/databend-query"
          ls -lh /mnt/target/release/databend-query
          /mnt/target/release/databend-query --version
      - uses: actions/upload-artifact@v6
        with:
          name: databend-query
          path: /mnt/target/release/databend-query
          retention-days: 30

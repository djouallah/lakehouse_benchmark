name: pg_lake image

# pg_lake publishes no images, only its Dockerfile: this builds the two it runs as -- Postgres
# with the pg_lake extensions, and pgduck_server (DuckDB behind the Postgres protocol) -- from a
# release tag, and pushes them to this repo's GHCR, where the bench pulls them.
#
# Two edits to upstream's Dockerfile, both for a benchmark rather than a dev container:
#   * PG_LAKE_REF is an ENV pinned to `main`, not a build arg: rewritten to the release tag.
#   * Postgres is compiled with --enable-cassert (and --enable-debug): assertion checks cost real
#     time in every executor and planner path, so they come out.
#
# Re-run on a new pg_lake release, then bump bench/pg_lake.py's tags.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: pg_lake release tag.
        type: string
        default: v3.5.3
      pg_major:
        description: PostgreSQL major version.
        type: choice
        options: ["18", "17"]
        default: "18"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [pg_lake_postgres, pgduck_server]
    steps:
      # DuckDB, the Azure SDK through vcpkg and Postgres all compile here: the toolchains the
      # image does not use make room for them.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v5
        with:
          repository: Snowflake-Labs/pg_lake
          ref: ${{ inputs.ref }}
          path: pg_lake

      - name: Pin the release, drop assertions
        working-directory: pg_lake/docker
        run: |
          sed -i "s|^ENV PG_LAKE_REF=.*|ENV PG_LAKE_REF=${{ inputs.ref }}|" Dockerfile
          sed -i -E 's/ --enable-cassert//g; s/ --enable-debug//g' Dockerfile
          grep -n 'PG_LAKE_REF=\|PG_COMPILE_FLAGS_' Dockerfile

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: pg_lake/docker
          file: pg_lake/docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: PG_MAJOR=${{ inputs.pg_major }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}:${{ inputs.ref }}-pg${{ inputs.pg_major }}
          cache-from: type=gha,scope=pg_lake-${{ matrix.target }}
          cache-to: type=gha,scope=pg_lake-${{ matrix.target }},mode=min

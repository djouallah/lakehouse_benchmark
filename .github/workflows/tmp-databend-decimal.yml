name: tmp databend decimal

# TEMPORARY. .github/scripts/tmp_databend_decimal.py: upstream repro, local Iceberg (Databend's
# own docker/it-iceberg-catalogs compose), no lakehouse. Delete once read.

on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        default: datafuselabs/databend:v1.2.949-nightly

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Iceberg REST + MinIO (databendlabs/databend docker/it-iceberg-catalogs)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databendlabs/databend/main/docker/it-iceberg-catalogs/docker-compose.yaml -o compose.yaml
          # minio/* left Docker Hub; the same tags are on quay.io.
          sed -i 's#image: minio/#image: quay.io/minio/#' compose.yaml
          docker compose -f compose.yaml up -d rest minio mc
          until curl -fs http://localhost:8181/v1/config; do sleep 2; done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pyiceberg[pyarrow]>=0.12" pymysql
      - run: python .github/scripts/tmp_databend_decimal.py "${{ inputs.image }}"
      - if: always()
        run: docker logs db 2>&1 | grep -i -E "error|panic" | tail -n 30 || true

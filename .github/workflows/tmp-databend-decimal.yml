name: tmp databend decimal

# TEMPORARY. .github/scripts/tmp_databend_decimal.py: upstream repro, a local Iceberg REST catalog
# on a file:// warehouse, no lakehouse. Delete once read.

on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        default: datafuselabs/databend:v1.2.949-nightly

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      # Same path in every container; the catalog runs as the runner user so pyiceberg can write
      # into the directories it creates.
      - name: Iceberg REST catalog, warehouse file:///tmp/wh
        run: |
          mkdir -p /tmp/wh
          docker run -d --name rest --user "$(id -u):$(id -g)" -p 8181:8181 -v /tmp/wh:/tmp/wh \
            -e CATALOG_WAREHOUSE=file:///tmp/wh \
            -e CATALOG_IO__IMPL=org.apache.iceberg.hadoop.HadoopFileIO \
            apache/iceberg-rest-fixture:1.9.2
          until curl -fs http://localhost:8181/v1/config; do sleep 2; done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pyiceberg[pyarrow]>=0.12" pymysql
      - run: python .github/scripts/tmp_databend_decimal.py "${{ inputs.image }}"
      - if: always()
        run: |
          docker logs rest 2>&1 | tail -n 20 || true
          docker logs db 2>&1 | grep -i -E "error|panic" | tail -n 30 || true

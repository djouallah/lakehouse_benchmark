name: tmp landing size

# TEMPORARY: one read-only listing of the workload's landing folder (Files/dbt/csv_raw) for the
# file count and size the Real workload tab shows on its source node. Deleted once measured.

on:
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/workload_land.txt
      - run: pip install -r requirements/workload_land.txt
      - name: List Files/dbt/csv_raw
        shell: python
        run: |
          from collections import defaultdict
          from bench import onelake
          from bench.workload.config import WorkloadConfig

          cfg = WorkloadConfig.from_env()
          fs = onelake.file_system(cfg)
          root = f"{cfg.files_relative}/csv_raw"
          files, size = defaultdict(int), defaultdict(int)
          for p in fs.get_paths(root, recursive=True):
              if p.is_directory:
                  continue
              folder = p.name[len(root) + 1:].split("/")[0]
              files[folder] += 1
              size[folder] += p.content_length or 0
          for k in sorted(files):
              print(f"{k:12s} {files[k]:7,d} files {size[k] / 1e9:9.2f} GB")
          print(f"{'total':12s} {sum(files.values()):7,d} files {sum(size.values()) / 1e9:9.2f} GB")
          print(f"::notice::daily {files['daily']:,} files, {size['daily'] / 1e9:.1f} GB; "
                f"all csv_raw {sum(files.values()):,} files, {sum(size.values()) / 1e9:.1f} GB")

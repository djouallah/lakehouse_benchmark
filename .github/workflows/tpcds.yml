name: tpcds bench

# THE SECOND QUERY SUITE: the same job graph as bench.yml, on TPC-DS's 24 tables and 99
# statements and the same shared scripts (BENCH_SUITE=tpcds picks the suite, bench/suite.py).
# It runs FEWER ENGINES than bench.yml -- three of TPC-H's seven cannot answer TPC-DS at SF=10
# at all, and bench/tpcds/config.py's ENGINES says which and on what evidence.
#
#   prepare  ->  bench (matrix, one engine at a time)  ->  publish
#
# `prepare` is the SINGLE WRITER of the TPC-DS Iceberg tables, for the reason bench.yml gives.
# It differs from the TPC-H one only in the generator: DuckDB's dsdgen fills a local database on
# the runner and DuckDB's parquet writer COPYs each table out in ~200 MB files, already stamped
# with the Iceberg field ids. From there it is the TPC-H landing exactly: upload the files as-is
# to Tables/<ns>/<table>/, one pyiceberg add_files per table (bench/tpcds/generate.py says why
# DuckDB's own Iceberg writer was tried and dropped, and why tpcgen was not the answer).
#
# `publish` is the SINGLE WRITER of results, under results/tpcds/ and docs/tpcds/ -- separate
# trees so the two query suites' histories never mix. It needs NO Azure credentials at all.

on:
  workflow_dispatch:
    inputs:
      sf:
        description: Scale factor. 1 is the smoke value; 60 is the default and the headline. 30, 60 and 100 free the runner's hidden disk first.
        type: choice
        options: ["1", "10", "30", "60", "100"]
        default: "60"
      engines:
        description: Comma-separated engines to run.
        type: string
        default: duckdb_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg,trino_iceberg,lakesail_iceberg
      regenerate:
        description: Drop and rewrite the namespace even if it is marked complete.
        type: boolean
        default: false
      publish:
        description: Commit results and charts. Off leaves the artifacts and touches nothing.
        type: boolean
        default: true

# QUEUE, NEVER CANCEL, and ONE GROUP FOR EVERY BENCHMARK -- the same string as bench.yml and
# etl.yml. The workflows share one lakehouse and one OneLake pipe, and the engine under test must
# have that pipe to itself. A run of any of them, at any SF or file count, queues behind whatever
# is running. A cancelled `prepare` leaves a namespace half-written; the next run resumes it
# (bench/tpcds/generate.py skips tables that already have data files), but that is never what
# you want to be doing on purpose.
concurrency:
  group: onelake
  cancel-in-progress: false

env:
  # The scripts live in .github/scripts and import `bench` from the repo root, which Python does
  # NOT put on sys.path (it adds the SCRIPT's directory, not the working directory).
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  # Which query suite the shared scripts run (bench/suite.py). bench.yml says tpch.
  BENCH_SUITE: tpcds
  TPCDS_SF: ${{ inputs.sf || '60' }}
  TPCDS_REGENERATE: ${{ inputs.regenerate || 'false' }}
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    # dsdgen at SF=10 plus ~3 GB of parquet out to OneLake takes well under this; SF=100 is ten
    # times the data through one runner. The cap is a hang guard, sized for the largest scale.
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      # BIG SCALES NEED THE DISK THE RUNNER HIDES. `/` is one 145 GB volume with ~87 GB free;
      # deleting the preinstalled toolchains nobody here uses brings that to ~105 GB. /mnt is a
      # directory on that same volume (`df` shows /dev/root for both), not a separate disk -- the
      # scratch sits there only because it is outside the workspace. SF=1/10 skip this.
      - name: Free runner disk (SF >= 30)
        if: contains(fromJSON('["30","60","100"]'), inputs.sf || '60')
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/tpcds && sudo chown "$USER" /mnt/tpcds
          echo "TPCDS_SCRATCH=/mnt/tpcds" >> "$GITHUB_ENV"
          df -h / /mnt
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/catalog.txt
            requirements/duckdb_iceberg.txt
      # catalog.txt is the TPC-H landing environment (pyiceberg, the ADLS client, the credential).
      # duckdb_iceberg.txt is the DuckDB that runs dsdgen -- the ENGINE's own file, on purpose:
      # dsdgen's output differs between DuckDB builds, so the generator has to be the build the
      # DuckDB bench job reads with, and smoke.yml generates SF=1 from the same file.
      - run: pip install -r requirements/catalog.txt -r requirements/duckdb_iceberg.txt

      - id: plan
        # The matrix needs a JSON array; the input is a human-friendly CSV. `started` is stamped
        # once here so every artifact in the run shares one timestamp.
        run: |
          ENGINES=$(printf '%s' "${{ inputs.engines || 'duckdb_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg,trino_iceberg,lakesail_iceberg' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "engines: $ENGINES"

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Generate TPC-DS with dsdgen, land it into OneLake (idempotent)
        run: python .github/scripts/prepare.py

  bench:
    needs: prepare
    # Display only -- see bench.yml. The final `|| matrix.engine` covers a new engine.
    name: >-
      ${{ matrix.engine == 'duckdb_iceberg' && '🦆 DuckDB'
      || matrix.engine == 'chdb_iceberg' && '⚡ chDB'
      || matrix.engine == 'polars_iceberg' && '🐻‍❄️ Polars'
      || matrix.engine == 'lakesail_iceberg' && '⛵ LakeSail'
      || matrix.engine == 'daft_iceberg' && '💠 Daft'
      || matrix.engine == 'pyspark_iceberg' && '✨ Spark-OSS'
      || matrix.engine == 'pyspark_gluten_iceberg' && '🚀 Gluten/Velox'
      || matrix.engine == 'starrocks_iceberg' && '⭐ StarRocks'
      || matrix.engine == 'trino_iceberg' && '🐰 Trino'
      || matrix.engine }}
    runs-on: ubuntu-latest
    # LONGER THAN bench.yml's 50, and longer than the 85 that cost run 35732997698 its Spark
    # numbers: 99 statements twice is four and a half times TPC-H's 44, and Spark at SF=10 spends
    # 42 minutes on the cold pass alone. It was killed at Q97 of the warm pass -- 85 minutes in,
    # with the whole run all but done and no part written, so the engine vanished from the
    # results entirely. The job cap must sit clear of the slowest engine, not on top of it.
    #
    # Token lifetime is a separate clock. TPC-DS first touches some tables late (ship_mode at Q62,
    # web_page at Q77), after the catalog bearer has expired, so the Spark engines restart their
    # session on fresh credentials between statements when fewer than 15 minutes are left
    # (bench/tpch/engines/pyspark_iceberg.py, refresh()).
    #
    # 355, JUST UNDER GITHUB'S 360 CEILING, raised from 150 for Spark-OSS at SF=30 and 60: 36
    # minutes cold at SF=10 grows at least with the data, and a job killed at the cap writes no
    # part at all. A hang still ends; it just ends later.
    timeout-minutes: 355
    permissions:
      id-token: write
      contents: read
    strategy:
      # MANDATORY. A LakeSail OOM must not delete DuckDB's results.
      fail-fast: false
      # ONE ENGINE AT A TIME. See bench.yml for the measurements behind this.
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(needs.prepare.outputs.engines) }}
    env:
      BENCH_ENGINE: ${{ matrix.engine }}
      # See bench.yml: DuckDB's azure extension needs the curl transport on Linux.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Local-mode Spark: the driver JVM IS the executor and its heap is fixed before Python
      # starts it, so .config("spark.driver.memory") is silently ignored and this must be env.
      SPARK_DRIVER_MEMORY: 11g
    steps:
      # SAME CLEANUP FOR THE ENGINE JOB, `/` only: DuckDB spills beside the workspace and the
      # engines' local caches live under $RUNNER_TEMP, both on `/`.
      - name: Free runner disk (SF >= 30)
        if: contains(fromJSON('["30","60","100"]'), inputs.sf || '60')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.engine }}.txt

      # One self-contained file per engine, the same files bench.yml installs: both query suites
      # measure one build of each engine.
      - name: Install ${{ matrix.engine }}
        run: |
          pip install -r "requirements/${BENCH_ENGINE}.txt"
          pip list --format=freeze | grep -Ei '^(duckdb|chdb|polars|pysail|pyiceberg|pyarrow)=' || true

      - uses: actions/setup-java@v5
        if: startsWith(matrix.engine, 'pyspark')
        with:
          distribution: temurin
          java-version: "17"

      # spark.jars.packages resolves iceberg-spark-runtime + hadoop-azure from Maven at every
      # SparkSession start; without this it is a fresh download per job.
      - uses: actions/cache@v4
        if: startsWith(matrix.engine, 'pyspark')
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # StarRocks is a container, not a wheel (bench/starrocks.py). Pull it here, OUTSIDE the
      # timer, so the setup row measures a cold start and not a multi-GB download.
      - name: Pull the StarRocks image
        if: matrix.engine == 'starrocks_iceberg'
        run: docker pull "$(python -c 'from bench.starrocks import IMAGE; print(IMAGE)')"

      # Trino too: the official image (bench/trino.py pins it), pulled outside the timer.
      - name: Pull the Trino image
        if: matrix.engine == 'trino_iceberg'
        run: docker pull "$(python -c 'from bench.trino import IMAGE; print(IMAGE)')"

      - name: Run 99 queries, one cold pass
        # `shell: bash` is pipefail. Without it `... | tee` exits 0 whatever the script did, and
        # run_engine.py's "attached but completed 0 statements" guard is silently defeated.
        shell: bash
        run: python .github/scripts/run_engine.py parts 2>&1 | tee "${{ matrix.engine }}.log"

      # The server may log statement text, and the catalog DDL carries the bearer. Python mints
      # it, so ::add-mask:: cannot cover it -- redact JWT shapes.
      - name: StarRocks server log
        if: always() && matrix.engine == 'starrocks_iceberg'
        run: |
          docker logs starrocks 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      # Trino's catalog DDL carries the bearer the same way.
      - name: Trino server log
        if: always() && matrix.engine == 'trino_iceberg'
        run: |
          docker logs trino 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tpcds-${{ matrix.engine }}
          path: |
            parts/*.json
            ${{ matrix.engine }}.log
          if-no-files-found: warn

  publish:
    needs: [prepare, bench]
    # !cancelled(): an engine that failed to attach should not stop the others being published,
    # but a CANCELLED run must publish nothing -- `always()` also runs on cancellation, and a
    # half-finished matrix is not a measurement of anything.
    # (wrapped in ${{ }}: a bare leading `!` is a YAML tag indicator, not an expression.)
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.publish != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # No id-token: this job never talks to Azure.
    concurrency:
      group: tpcds-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      BENCH_RUN_STARTED_AT: ${{ needs.prepare.outputs.started }}
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - uses: actions/download-artifact@v6
        with:
          pattern: tpcds-*
          merge-multiple: true
          path: parts

      - name: Merge, chart, and write the table view
        run: python .github/scripts/publish.py parts

      - name: Commit results and charts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop.
        #
        # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE. bench.yml has the run that paid for
        # this rule. Nothing under results/ or docs/ is hand-written -- every byte is a function
        # of results/**/*.json -- so: drop this attempt, reset onto origin/main and generate
        # again. parts/ is untracked, so the artifacts survive the reset.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add results docs README.md
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "tpcds: SF=${TPCDS_SF} results for run ${{ github.run_id }}"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python .github/scripts/publish.py parts
          done
          echo "::error::could not push after 3 attempts"
          exit 1

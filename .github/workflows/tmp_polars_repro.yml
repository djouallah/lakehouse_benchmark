name: temporary polars repro

# TEMPORARY: runs a script under .github/scripts/tmp/ against a Polars main build
# (tmp_polars_main.yml), to confirm a Polars bug off OneLake before drafting the issue. No OneLake,
# no secrets. Deleted once the issue is filed.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Short sha of a polars-main-<sha> prerelease of this repo.
        type: string
        required: true
      script:
        description: Script under .github/scripts/tmp/ to run.
        type: string
        default: polars_q64_memory_repro.py
      sf:
        description: TPC-DS scale factor the script generates locally (polars_q64_memory_repro.py).
        type: string
        default: "30"
      budgets:
        description: Comma-separated POLARS_OOC_MEMORY_BUDGET_MB values, "none" for unset.
        type: string
        default: none,2000,1000

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/repro && sudo chown "$USER" /mnt/repro
          df -h / /mnt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          base=https://github.com/djouallah/lakehouse_benchmark/releases/download/polars-main-${{ inputs.sha }}
          pip install psutil tpcgen-cli==4.0.0 "polars @ $base/polars-2.1.0-py3-none-any.whl" \
            "polars-runtime-32 @ $base/polars_runtime_32-2.1.0-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - run: python .github/scripts/tmp/${{ inputs.script }}
        env:
          SF: ${{ inputs.sf }}
          BUDGETS: ${{ inputs.budgets }}
          DATA_DIR: /mnt/repro/tpcds_sf${{ inputs.sf }}
          POLARS_SHA: ${{ inputs.sha }}

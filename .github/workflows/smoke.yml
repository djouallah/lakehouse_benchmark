name: smoke

# TWO PHASES, CHEAP ONE FIRST.
#
#   sql (matrix)  ->  compare  ->  catalog (matrix)
#
# `plan` also GENERATES the suite's SF=1 parquet, once, and every `sql` job reads it from
# the cache. That is not a shortcut: `compare` only means something if every engine read
# IDENTICAL bytes, and the first TPC-DS run had each engine job generate its own copy --
# the DuckDB jobs on the 2.0 nightly wheel, the others on stable 1.5 -- and dsdgen's output
# differs between those builds (same row counts, different values). 18 of 99 queries
# "disagreed" on data, not on SQL. One generation, one cache key, one dataset.
#
# `sql` runs the suite's queries -- TPC-H's 22 or TPC-DS's 99 -- against that LOCAL parquet. No secrets, no Fabric, no id-token --
# it answers "does this engine speak the dialect" in about a minute. `compare` then checks that
# every engine returned the SAME row count for the same query, which is a correctness signal the
# benchmark itself cannot produce.
#
# `catalog` attaches the real OneLake Iceberg REST catalog and reads two queries. It runs LAST
# and only if `sql` passed, so a failure there is unambiguously credentials or storage -- never
# SQL. Every expensive debugging session in this repo so far came from those two questions being
# tangled together in one 15-minute log.
#
# This is the gate a new engine passes BEFORE it is added to bench.yml.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: Comma-separated engines to smoke.
        type: string
        default: duckdb_iceberg,chdb_iceberg,polars_iceberg,lakesail_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg,trino_iceberg
      catalog:
        description: Also run phase 2 against OneLake. Off runs the local SQL phase only.
        type: boolean
        default: true
      suite:
        description: Which query suite. tpch generates SF=1 with tpchgen-cli; tpcds with DuckDB's dsdgen.
        type: choice
        options: ["tpch", "tpcds"]
        default: "tpch"
      queries:
        description: Comma-separated query numbers for both phases, e.g. 3,7,16,42,55. Empty runs the whole suite locally and the two probes on OneLake.
        type: string
        default: ""
  push:
    # Phase 1 only (see the `if` on `catalog`). It touches no secret and no Fabric, so it is safe
    # and cheap on every commit that could change what the engines do.
    paths:
      - "bench/**"
      - "sql/**"
      - "requirements/**"
      - ".github/scripts/smoke_*.py"
      - ".github/workflows/smoke.yml"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  # A push runs TPC-H (the default); TPC-DS is dispatch-only. See bench/suite.py.
  BENCH_SUITE: ${{ inputs.suite || 'tpch' }}
  SMOKE_QUERIES: ${{ inputs.queries || '' }}

jobs:
  # The matrix needs a JSON array; the input is a human-friendly CSV. Same jq as bench.yml.
  # And the ONE generation of the suite's SF=1 parquet, saved to the cache the sql jobs read.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
    steps:
      - id: plan
        run: |
          ENGINES=$(printf '%s' "${{ inputs.engines || 'duckdb_iceberg,chdb_iceberg,polars_iceberg,lakesail_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg,trino_iceberg' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "engines: $ENGINES"

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # THE GENERATOR IS THE WRITER'S WHEEL. TPC-H: tpchgen-cli, deterministic at any version.
      # TPC-DS: DuckDB's dsdgen from the DuckDB ENGINE's own requirements file -- the same
      # pre-release line tpcds.yml's prepare job generates SF=10 with -- because dsdgen's output
      # is not the same across DuckDB builds (see the header). Two suites, two generators, each
      # pinned by the file that already pins it.
      - if: (inputs.suite || 'tpch') == 'tpcds'
        run: pip install -r requirements/duckdb_iceberg.txt
      - if: (inputs.suite || 'tpch') != 'tpcds'
        run: pip install -r requirements/smoke.txt

      # SF=1 is deterministic for one generator, so one generation serves every run and every
      # engine. One cache per suite: tpch-local/ from tpchgen-cli, tpcds-local/ from dsdgen.
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.suite || 'tpch' }}-local
          key: ${{ inputs.suite || 'tpch' }}-local-sf1-v2

      - name: Generate the suite's SF=1 parquet (skipped on a cache hit)
        run: python .github/scripts/smoke_sql.py --generate

  sql:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NO id-token, NO secrets. That is the point of this job.
    permissions:
      contents: read
    strategy:
      # One engine's dialect gap must not hide another's.
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    env:
      # Local-mode Spark: the driver JVM IS the executor and its heap is fixed before Python
      # starts it. At the 1g default five TPC-DS queries died in "Not enough memory to build and
      # broadcast the table" at SF=1 -- a smoke artefact, not a dialect gap. Same value as the
      # catalog job and bench.yml, so phase 1 runs the JVM the benchmark runs.
      SPARK_DRIVER_MEMORY: 11g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.engine }}.txt

      # Spark 4 needs JDK 17+. ubuntu-latest already defaults to 17, but "latest" and "default"
      # both drift, and a silent bump to a deprecated tier is not something a benchmark should
      # discover from a stack trace. Temurin is cached on hosted runners, so this costs ~0s.
      - uses: actions/setup-java@v5
        if: startsWith(matrix.engine, 'pyspark')
        with:
          distribution: temurin
          java-version: "17"

      # The ENGINE's file only. No generator here: the data comes from the cache `plan` filled.
      - run: pip install -r "requirements/${{ matrix.engine }}.txt"

      # Restored, never generated here (see the header): `plan` ran first and saved this key.
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.suite || 'tpch' }}-local
          key: ${{ inputs.suite || 'tpch' }}-local-sf1-v2
          fail-on-cache-miss: true

      # StarRocks is a container, not a wheel (bench/starrocks.py). Pull it here, OUTSIDE the
      # timer, so the setup row measures a cold start and not a multi-GB download.
      - name: Pull the StarRocks image
        if: matrix.engine == 'starrocks_iceberg'
        run: docker pull "$(python -c 'from bench.starrocks import IMAGE; print(IMAGE)')"

      # Trino too: the official image (bench/trino.py pins it), pulled outside the timer.
      - name: Pull the Trino image
        if: matrix.engine == 'trino_iceberg'
        run: docker pull "$(python -c 'from bench.trino import IMAGE; print(IMAGE)')"

      - name: Run the suite's queries against local parquet
        run: python .github/scripts/smoke_sql.py "${{ matrix.engine }}"

      # The server may log statement text, and the catalog DDL carries the bearer. Python mints
      # it, so ::add-mask:: cannot cover it -- redact JWT shapes.
      - name: StarRocks server log
        if: always() && matrix.engine == 'starrocks_iceberg'
        run: |
          docker logs starrocks 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      # Trino's catalog DDL carries the bearer the same way.
      - name: Trino server log
        if: always() && matrix.engine == 'trino_iceberg'
        run: |
          docker logs trino 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-${{ matrix.engine }}
          path: smoke/*.json
          if-no-files-found: warn

  compare:
    needs: sql
    # always(): an engine that failed its own queries should not stop the others being compared.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          pattern: smoke-*
          merge-multiple: true
          path: smoke
      - name: Every engine must agree on every row count
        run: python .github/scripts/smoke_sql.py --compare

  catalog:
    needs: [plan, sql]
    # Dispatch-only, and only when phase 1 passed. A push never burns a Fabric round trip.
    if: github.event_name == 'workflow_dispatch' && inputs.catalog != false && needs.sql.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    env:
      BENCH_ENGINE: ${{ matrix.engine }}
      TPCH_SF: "1"
      TPCDS_SF: "1"
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Same pair bench.yml sets. DuckDB's azure extension fails the OneLake TLS handshake on
      # its default transport, and the symptom is an unreadable data file, not an auth error.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Local-mode Spark: the driver JVM IS the executor, and its heap is fixed before Python
      # starts it -- so .config("spark.driver.memory") is silently ignored and this must be an
      # env var. 11g matches the ceiling chDB is given, leaving room for Python and page cache.
      SPARK_DRIVER_MEMORY: 11g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.engine }}.txt

      # Spark 4 needs JDK 17+. ubuntu-latest already defaults to 17, but "latest" and "default"
      # both drift, and a silent bump to a deprecated tier is not something a benchmark should
      # discover from a stack trace. Temurin is cached on hosted runners, so this costs ~0s.
      - uses: actions/setup-java@v5
        if: startsWith(matrix.engine, 'pyspark')
        with:
          distribution: temurin
          java-version: "17"

      # spark.jars.packages resolves iceberg-spark-runtime + hadoop-azure from Maven at every
      # SparkSession start. Without this it is a download per job.
      - uses: actions/cache@v4
        if: startsWith(matrix.engine, 'pyspark')
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1

      - run: pip install -r "requirements/${{ matrix.engine }}.txt"

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Attach OneLake and read
        run: python .github/scripts/smoke_catalog.py

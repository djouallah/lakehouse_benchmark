name: temporary sail repro

# TEMPORARY: runs .github/scripts/tmp/sail_repro.py against one pysail wheel (a tmp_sail_main.yml
# build), to confirm a Sail bug on current main before reporting it. No OneLake, no secrets.
# Deleted once the issues are filed.

on:
  workflow_dispatch:
    inputs:
      wheel:
        description: pysail wheel URL (a sail-main-<sha> prerelease asset of this repo).
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pysail @ ${{ inputs.wheel }}" pyspark-client
      - run: pip list --format=freeze | grep -Ei '^(pysail|pyspark)'
      - run: python .github/scripts/tmp/sail_repro.py

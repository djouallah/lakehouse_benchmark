name: tmp polars tpcds

# TEMPORARY: the 99 TPC-DS queries on Polars 2.0.0 vs the Polars main build, over a local Iceberg
# catalog (no OneLake), to find what made bench run 37859527146 stall. Delete with
# .github/scripts/tmp_polars_tpcds.py.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sf: ["1", "10"]
        polars: [release, main]
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # requirements/polars_iceberg.txt points at the main wheels for now; release is PyPI's 2.0.0.
      - run: pip install -r requirements/polars_iceberg.txt "pyiceberg[sql-sqlite]"
      - if: matrix.polars == 'release'
        run: pip install --force-reinstall --no-deps polars==2.0.0 polars-runtime-32==2.0.0
      - uses: ./.github/actions/duckdb-nightly
      - run: python .github/scripts/tmp_polars_tpcds.py gen ${{ matrix.sf }}
      - run: python .github/scripts/tmp_polars_tpcds.py run ${{ matrix.sf }} ${{ matrix.polars }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: polars-${{ matrix.polars }}-sf${{ matrix.sf }}
          path: ${{ runner.temp }}/polars-*.json

  compare:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          path: out
      - run: python .github/scripts/tmp_polars_tpcds.py compare out

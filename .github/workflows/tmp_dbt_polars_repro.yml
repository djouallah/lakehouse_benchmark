name: temporary dbt-polars repro

# TEMPORARY: runs .github/scripts/tmp/dbt_polars_merge_collect_repro.py against dbt-polars main,
# to measure the incremental merge's memory on a local Delta table before filing the issue. No
# OneLake, no secrets. Deleted once the issue is filed.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows in the batch (20 Float64 columns + id).
        type: string
        default: "20000000"
      ref:
        description: dbt-polars git ref to install.
        type: string
        default: main

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dbt-polars from git
        env:
          REF: ${{ inputs.ref }}
        run: |
          pip install "dbt-polars @ git+https://github.com/datamindedbe/dbt-polars@${REF}" psutil pyarrow
          pip list --format=freeze | grep -Ei '^(dbt-|polars|deltalake|pyarrow)'
      - name: Repro
        env:
          ROWS: ${{ inputs.rows }}
        run: python .github/scripts/tmp/dbt_polars_merge_collect_repro.py "$ROWS"

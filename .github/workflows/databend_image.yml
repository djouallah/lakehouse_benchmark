name: databend image

# The Databend engine's image: databend-query from a databend_build.yml run, copied into the stock
# nightly image, pushed to this repo's GHCR, where bench/databend.py pulls it. Until a nightly image
# carries the Iceberg decimal fix (databend#20594); then bench/databend.py points at that and this file
# and databend_build.yml go.

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: databend_build.yml run whose databend-query artifact goes in.
        type: string
      tag:
        description: Image tag, e.g. main-8b1dc20714 (the databend commit).
        type: string
      base:
        description: Nightly image the binary goes into; the version the build was stamped with.
        type: string
        default: v1.2.952-nightly

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: databend-query
          path: image
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          BASE: ${{ inputs.base }}
          TAG: ghcr.io/${{ github.repository_owner }}/databend:${{ inputs.tag }}
        run: |
          chmod +x image/databend-query
          printf 'FROM datafuselabs/databend:%s\nCOPY databend-query /usr/bin/databend-query\n' "$BASE" > image/Dockerfile
          docker build -t "$TAG" image
          docker run --rm --entrypoint /usr/bin/databend-query "$TAG" --version
          docker push "$TAG"

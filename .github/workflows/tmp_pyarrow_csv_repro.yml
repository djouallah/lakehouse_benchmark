name: temporary pyarrow csv repro

# Repro for an Arrow issue: a short first row fixes the CSV column count. Deleted after the run.

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyarrow==26.0.0
      - name: Repro
        run: |
          cat > repro.py <<'PY'
          import io
          import pyarrow as pa
          from pyarrow import csv
          
          print("pyarrow", pa.__version__)
          data = b"a,b\n1,2,3,4\n5,6,7,8\n"
          names = ["w", "x", "y", "z"]
          
          def run(label, **kw):
              try:
                  t = csv.read_csv(io.BytesIO(data), **kw)
                  print(label, "->", t.to_pydict())
              except Exception as e:
                  print(label, "->", type(e).__name__, e)
          
          run("1 column_names", read_options=csv.ReadOptions(column_names=names))
          run("2 column_names + skip", read_options=csv.ReadOptions(column_names=names),
              parse_options=csv.ParseOptions(invalid_row_handler=lambda r: "skip"))
          run("3 column_names + column_types", read_options=csv.ReadOptions(column_names=names),
              convert_options=csv.ConvertOptions(column_types={n: pa.int64() for n in names}))
          run("4 autogenerate", read_options=csv.ReadOptions(autogenerate_column_names=True))
          PY
          python repro.py

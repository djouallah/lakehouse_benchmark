# TEMPORARY: re-export docs/architecture.png from the .excalidraw source. Deleted after use.
name: tmp diagram export
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd .github/tmp_diagram
          npm init -y >/dev/null
          npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node export.mjs ../../docs/architecture.excalidraw ../../architecture.png
      - uses: actions/upload-artifact@v4
        with:
          name: architecture
          path: architecture.png

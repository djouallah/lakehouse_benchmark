name: temporary avro record names

# TEMPORARY, read-only: the Avro record names each engine writes in its manifest lists
# (.github/scripts/tmp/avro_names). Main only: the OIDC trust is main. Deleted once answered.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - working-directory: .github/scripts/tmp/avro_names
        run: |
          go mod init names
          go get github.com/apache/iceberg-go@b7792e9e8799
          go mod tidy
          go build -o names .
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read
        env:
          WAREHOUSE: ${{ secrets.FABRIC_WORKSPACE_ID }}/${{ secrets.FABRIC_LAKEHOUSE_ID }}
        shell: bash
        run: |
          export ONELAKE_TOKEN=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$ONELAKE_TOKEN"
          .github/scripts/tmp/avro_names/names 2>&1 | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

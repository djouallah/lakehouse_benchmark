name: light etl bench

# THE SECOND BENCHMARK: the Light ETL notebook, ported the way bench.yml ports the TPC-H one.
# Read N AEMO daily CSVs from OneLake, filter and cast them, write one Iceberg table per engine.
#
#   land  ->  CSV-Transform-OneLake-Iceberg (matrix, one engine at a time)  ->  publish
#
# `land` is the SINGLE WRITER of Files/csv in the lakehouse. It downloads the daily zips and lands
# the CSVs inside them uncompressed, once, idempotently: a lakehouse that already holds N files
# costs one listing. Seven matrix jobs downloading the same files would be seven times the work
# and a race on every upload.
#
# Every engine job reads Files/csv and writes ITS OWN table, T{n}.<engine>, so unlike the TPC-H
# workflow there is no shared table to race on. max-parallel stays 1 anyway, for the reason
# bench.yml gives: seven clients sharing one OneLake pipe measure the pipe, not the engines.
#
# `publish` is the SINGLE WRITER of results, under results/etl/ and docs/etl/ -- separate from
# the TPC-H trees so the two histories never mix. It needs no Azure credentials at all.

on:
  workflow_dispatch:
    inputs:
      files:
        description: Daily CSV files to load. 10 is the smoke value; 1000 is the notebook's (52 GB, landed once).
        type: choice
        options: ["10", "100", "1000"]
        default: "100"
      engines:
        description: Comma-separated engines to run.
        type: string
        default: duckdb_iceberg,chdb_iceberg,polars_iceberg,daft_iceberg,lakesail_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg,trino_iceberg
      publish:
        description: Commit results and charts. Off leaves the artifacts and touches nothing.
        type: boolean
        default: true

# ONE GROUP FOR BOTH BENCHMARKS, and it is the same string in bench.yml. The two workflows share
# one lakehouse and one OneLake pipe, and every number here assumes the engine under test has
# that pipe to itself -- a TPC-H run and an ETL run at the same time would be two measurements of
# each other. So a run of either queues behind whatever is running, at any SF or file count.
# QUEUE, NEVER CANCEL: a cancelled landing leaves a half-populated Files/csv, which the next run
# completes -- correct, but a wasted download.
concurrency:
  group: onelake
  cancel-in-progress: false

env:
  # The scripts live in .github/scripts and import `bench` from the repo root, which Python does
  # NOT put on sys.path (it adds the SCRIPT's directory, not the working directory).
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  ETL_FILES: ${{ inputs.files || '100' }}
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  land:
    runs-on: ubuntu-latest
    # A download-only landing on a free runner: the cap is a hang guard, not a cost control.
    # 1000 files is ~5 GB of zips in and ~52 GB of CSV out to OneLake.
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/landing.txt
      - run: pip install -r requirements/landing.txt

      - id: plan
        # The matrix needs a JSON array; the input is a human-friendly CSV. `started` is stamped
        # once here so every artifact in the run shares one timestamp.
        run: |
          ENGINES=$(printf '%s' "${{ inputs.engines || 'duckdb_iceberg,chdb_iceberg,polars_iceberg,daft_iceberg,lakesail_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg,trino_iceberg' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "engines: $ENGINES"

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Land the CSVs into OneLake (idempotent)
        env:
          # The GitHub mirror listing is a contents-API call per year; anonymous is 60/hour.
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/etl_land.py

  # The job ID is the benchmark, spelled out: the Actions graph groups a matrix under the job
  # ID (the per-engine `name` below is dynamic, so the graph cannot use it), and "Matrix: etl"
  # said nothing. It now reads land -> CSV-Transform-OneLake-Iceberg -> publish, which is the
  # whole benchmark in one line for anyone who opens the run before the results.
  CSV-Transform-OneLake-Iceberg:
    needs: land
    # Display only -- see bench.yml. The final `|| matrix.engine` covers a new engine.
    name: >-
      ${{ matrix.engine == 'duckdb_iceberg' && '🦆 DuckDB'
      || matrix.engine == 'chdb_iceberg' && '⚡ chDB'
      || matrix.engine == 'polars_iceberg' && '🐻‍❄️ Polars'
      || matrix.engine == 'daft_iceberg' && '💠 Daft'
      || matrix.engine == 'lakesail_iceberg' && '⛵ LakeSail'
      || matrix.engine == 'pyspark_iceberg' && '✨ Spark-OSS'
      || matrix.engine == 'pyspark_gluten_iceberg' && '🚀 Gluten/Velox'
      || matrix.engine == 'starrocks_iceberg' && '⭐ StarRocks'
      || matrix.engine == 'trino_iceberg' && '🐰 Trino'
      || matrix.engine }}
    runs-on: ubuntu-latest
    # The Entra token is baked into DuckDB's ATTACH, chDB's url() header, Sail's env var and the
    # pyiceberg catalog, and none of them ever asks for a new one. 50 minutes keeps the whole job
    # inside the lifetime of the token it was handed.
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
    strategy:
      # MANDATORY. One engine's OOM must not delete another's results.
      fail-fast: false
      # ONE ENGINE AT A TIME. See bench.yml for the measurements behind this.
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(needs.land.outputs.engines) }}
    env:
      BENCH_ENGINE: ${{ matrix.engine }}
      # DuckDB's azure extension: curl transport, or every OneLake read and write fails on Linux
      # with an error that reads like a credential problem. See bench.yml and config.azure_transport.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Local-mode Spark: the driver heap is fixed before Python starts it, so this must be env.
      SPARK_DRIVER_MEMORY: 11g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/etl_${{ matrix.engine }}.txt

      # requirements/etl_<engine>.txt is the engine's own file plus what the ETL adds (pyiceberg
      # for the engines that write through it, the ADLS client for the Files/csv listing), each
      # self-contained like the rest of requirements/. Same engine specs as bench.yml, so both
      # benchmarks measure one build of each engine.
      - name: Install ${{ matrix.engine }}
        run: |
          pip install -r "requirements/etl_${BENCH_ENGINE}.txt"
          pip list --format=freeze | grep -Ei '^(duckdb|chdb|polars|daft|pysail|pyspark|pyiceberg|pyarrow)=' || true

      - uses: actions/setup-java@v5
        if: startsWith(matrix.engine, 'pyspark')
        with:
          distribution: temurin
          java-version: "17"

      # Same cache as bench.yml: spark.jars.packages resolves the same two artifacts.
      - uses: actions/cache@v4
        if: startsWith(matrix.engine, 'pyspark')
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # StarRocks is a container, not a wheel (bench/starrocks.py). Pull it here, OUTSIDE the
      # timer, so the setup row measures a cold start and not a multi-GB download.
      - name: Pull the StarRocks image
        if: matrix.engine == 'starrocks_iceberg'
        run: docker pull "$(python -c 'from bench.starrocks import IMAGE; print(IMAGE)')"

      # Trino too: the official image (bench/trino.py pins it), pulled outside the timer.
      - name: Pull the Trino image
        if: matrix.engine == 'trino_iceberg'
        run: docker pull "$(python -c 'from bench.trino import IMAGE; print(IMAGE)')"

      - name: Read ${{ inputs.files || '100' }} CSVs, write Iceberg
        # `shell: bash` is pipefail. Without it `... | tee` exits 0 whatever the script did.
        shell: bash
        run: python .github/scripts/etl_run_engine.py parts 2>&1 | tee "${{ matrix.engine }}.log"

      # The server may log statement text, and the catalog DDL carries the bearer. Python mints
      # it, so ::add-mask:: cannot cover it -- redact JWT shapes.
      - name: StarRocks server log
        if: always() && matrix.engine == 'starrocks_iceberg'
        run: |
          docker logs starrocks 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      # Trino's catalog DDL carries the bearer the same way.
      - name: Trino server log
        if: always() && matrix.engine == 'trino_iceberg'
        run: |
          docker logs trino 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: etl-${{ matrix.engine }}
          path: |
            parts/*.json
            ${{ matrix.engine }}.log
          if-no-files-found: warn

  publish:
    needs: [land, CSV-Transform-OneLake-Iceberg]
    # !cancelled(): an engine that FAILED must not stop the others being published, but a
    # CANCELLED run must publish nothing. `always()` does not make that distinction -- it ran this
    # job for cancelled run 35548585688 and committed its one surviving engine as if it were a
    # measurement, which then collided with the real run's results.
    # (wrapped in ${{ }}: a bare leading `!` is a YAML tag indicator, not an expression.)
    if: ${{ !cancelled() && needs.land.result == 'success' && inputs.publish != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # No id-token: this job never talks to Azure.
    concurrency:
      group: etl-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      BENCH_RUN_STARTED_AT: ${{ needs.land.outputs.started }}
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - uses: actions/download-artifact@v6
        with:
          pattern: etl-*
          merge-multiple: true
          path: parts

      - name: Merge, chart, and write the table view
        run: python .github/scripts/etl_publish.py parts

      - name: Commit results and charts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop.
        #
        # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE. Run 35550043819 lost six green engines
        # to `git pull --rebase`: another publish had landed the same four generated paths while
        # this ran, so the rebase hit add/add conflicts (two of them PNGs) and the step died with
        # the measurements still in the artifact. Nothing under results/ or docs/ here is
        # hand-written -- every byte is a function of results/**/*.json, and the history files
        # (the flattened CSV, the charts, the table view) are a function of ALL runs -- so even
        # where git could merge two generators' output, the merge would be wrong. So: drop this
        # attempt, reset onto origin/main (which now HAS the other run's JSON) and generate again.
        # parts/ is untracked, so the artifacts survive the reset.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add results docs README.md
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "etl: FILES=${ETL_FILES} results for run ${{ github.run_id }}"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python .github/scripts/etl_publish.py parts
          done
          echo "::error::could not push after 3 attempts"
          exit 1

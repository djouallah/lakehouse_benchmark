name: iceberg support

# WHAT EACH ENGINE CAN DO against the OneLake Iceberg REST catalog: the site's Iceberg support tab.
#
#   plan  ->  ask (one job per client, one at a time)  ->  publish
#
# Each client's probe script creates its own tables under _bench_capability, sends one operation
# per probe through the engine, and checks the effect through pyiceberg. The concurrency rows put
# a second writer's commit between the engine's read and its commit (bench/capability/race.py).
#
# `publish` is the SINGLE WRITER of results/capability/, docs/capability/RESULTS.md and
# docs/data/capability.json. results/capability/ keeps each client's latest reading, so a run
# that asks one client leaves the others' cells as they were.

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Which clients to ask.
        type: choice
        options:
          - polars,duckdb,sail,chdb,duckdb_isolation
          - polars
          - duckdb
          - sail
          - chdb
          - duckdb_isolation
        default: polars,duckdb,sail,chdb,duckdb_isolation
      keep:
        description: Leave the probe tables behind, to inspect them in Fabric.
        type: boolean
        default: false

# The same group as bench.yml, tpcds.yml and etl.yml: one lakehouse, one OneLake pipe.
concurrency:
  group: onelake
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clients: ${{ steps.plan.outputs.clients }}
      chdb_core_source: ${{ steps.chdb_core.outputs.source }}
    steps:
      - id: plan
        run: |
          CLIENTS=$(printf '%s' "${{ inputs.clients || 'polars,duckdb,sail,chdb,duckdb_isolation' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "clients=$CLIENTS" >> "$GITHUB_OUTPUT"
          echo "clients: $CLIENTS"

      - uses: actions/checkout@v5
      - id: chdb_core
        name: Resolve chdb-core
        if: contains(fromJSON(steps.plan.outputs.clients), 'chdb')
        uses: ./.github/actions/chdb-core-latest
        with:
          resolve-only: "true"

  ask:
    needs: plan
    name: >-
      ${{ matrix.client == 'duckdb' && 'DuckDB (pre-release)'
      || matrix.client == 'polars' && 'Polars'
      || matrix.client == 'sail' && 'LakeSail'
      || matrix.client == 'chdb' && 'chDB'
      || matrix.client == 'duckdb_isolation' && 'DuckDB isolation and transactions'
      || matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      # One client's failure must not delete the others' answers.
      fail-fast: false
      max-parallel: 1
      matrix:
        client: ${{ fromJSON(needs.plan.outputs.clients) }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CAPABILITY_KEEP: ${{ inputs.keep && '1' || '0' }}
      RESULTS_FILE: results/capability/${{ matrix.client }}.json
      REQS: >-
        requirements/capability_${{ matrix.client == 'duckdb_isolation' && 'duckdb' || matrix.client }}.txt
      SCRIPT: >-
        .github/scripts/capability/${{ matrix.client == 'duckdb_isolation' && 'isolation_duckdb'
        || format('catalog_capability_{0}', matrix.client) }}.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install ${{ matrix.client }}
        run: |
          pip install -r "$REQS"
          pip list --format=freeze | grep -Ei '^(pyiceberg|pyarrow|pysail|chdb|polars)=' || true

      - name: Install latest usable chdb-core
        if: matrix.client == 'chdb'
        uses: ./.github/actions/chdb-core-latest
        with:
          source: ${{ needs.plan.outputs.chdb_core_source }}

      # DuckDB is the nightly CLI, not a wheel: bench/duckdb_cli.py says why.
      - name: DuckDB nightly CLI
        if: matrix.client == 'duckdb' || matrix.client == 'duckdb_isolation'
        uses: ./.github/actions/duckdb-nightly

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Probe ${{ matrix.client }}
        # `shell: bash` is pipefail. Without it `... | tee` exits 0 whatever the script did.
        shell: bash
        run: python "$SCRIPT" 2>&1 | tee "capability-${{ matrix.client }}.log"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capability-${{ matrix.client }}
          path: |
            capability-${{ matrix.client }}.log
            results/capability/${{ matrix.client }}.json
          if-no-files-found: warn

  publish:
    needs: ask
    # !cancelled(), not always(): a cancelled run publishes nothing (see etl.yml's publish).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - uses: actions/download-artifact@v6
        with:
          pattern: capability-*
          merge-multiple: true
          path: parts

      - name: Write RESULTS.md and the site's grid
        run: |
          mkdir -p results/capability
          cp parts/results/capability/*.json results/capability/ 2>/dev/null || true
          python .github/scripts/capability/render_readme.py
          python .github/scripts/capability_publish.py

      - name: Commit results and the grid
        # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE: the rule etl.yml's publish states.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add results/capability docs/capability docs/data/capability.json
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "iceberg support: readings from run ${{ github.run_id }}"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p results/capability
            cp parts/results/capability/*.json results/capability/ 2>/dev/null || true
            python .github/scripts/capability/render_readme.py
            python .github/scripts/capability_publish.py
          done
          echo "::error::could not push after 3 attempts"
          exit 1

name: capability

# WHAT EACH ENGINE CAN DO against the OneLake Iceberg REST catalog, for the site's Capability tab.
# The probes run in djouallah/iceberg-probe-native, which publishes the grid as
# docs/capability.json; this copies it to docs/data/capability.json, checked, and commits it. No
# Azure, no engines, so it does not join the `onelake` concurrency group.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capability-publish
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - name: Fetch, check and write the grid
        run: python .github/scripts/capability_publish.py

      - name: Commit the grid
        if: github.ref == 'refs/heads/main'
        # Same rule as the other publishers: on a rejected push, regenerate on top of origin/main.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add docs/data/capability.json
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "capability: grid from iceberg-probe-native"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python .github/scripts/capability_publish.py
          done
          echo "::error::could not push after 3 attempts"
          exit 1

name: temporary chdb tpcds repro

# Temporary: minimal repros for the TPC-DS queries chDB fails, on the chdb-core the bench pins.
# Deleted after the upstream issue is filed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements/chdb_iceberg.txt
      - run: python .github/scripts/tmp_chdb_tpcds_repro.py

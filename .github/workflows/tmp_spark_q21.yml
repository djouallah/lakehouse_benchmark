name: tmp spark q21

# TEMPORARY, deleted once read. TPC-H SF=100 Q21 fails on Spark-OSS with "Not enough memory to
# build and broadcast the table" (runs 36016179553, 36151085980). This prints Q21's plan and runs
# it once per memory setting, to see which lets the forced broadcast build.

on:
  workflow_dispatch:
    inputs:
      sf:
        type: choice
        options: ["10", "100"]
        default: "100"
      publish:
        type: boolean
        default: false

concurrency:
  group: onelake
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  BENCH_SUITE: tpch
  BENCH_ENGINE: pyspark_iceberg
  TPCH_SF: ${{ inputs.sf }}
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  SPARK_DRIVER_MEMORY: 11g

jobs:
  q21:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/pyspark_iceberg.txt
      - run: pip install -r requirements/pyspark_iceberg.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Q21 plan and broadcast variants
        shell: bash
        run: |
          python - <<'EOF'
          import os, time
          from bench.suite import suite_class
          from bench.tpch.engines import pyspark_iceberg as mod
          from bench.tpch.queries import load

          # Q21's NOT IN over a nullable key is a null-aware anti join, which Spark always
          # broadcasts: thresholds cannot turn it off (run 36287446363). So the variants are
          # memory: heap size and the execution share, each in a fresh JVM (both are static).
          cfg = suite_class().from_env()
          variants = [
              ("11g, fraction 0.8", "11g", {"spark.memory.fraction": "0.8"}),
              ("13g, fraction 0.6", "13g", {}),
              ("13g, fraction 0.8", "13g", {"spark.memory.fraction": "0.8"}),
          ]
          for name, heap, extra in variants:
              os.environ["SPARK_DRIVER_MEMORY"] = heap
              mod.PysparkIceberg._extra_config = lambda self, extra=extra: dict(extra)
              eng = mod.PysparkIceberg(cfg)
              eng.setup()
              q21 = load(eng.name, cfg.schema, cfg.sf, cfg.SQL_PATH, cfg.N_QUERIES)[20]
              start = time.perf_counter()
              try:
                  rows = len(eng.session.sql(q21).collect())
                  print(f"=== {name}: OK {time.perf_counter() - start:.1f}s {rows} rows")
              except Exception as exc:
                  print(f"=== {name}: FAILED {time.perf_counter() - start:.1f}s {str(exc)[:300]}")
              os.system("free -m | sed -n 2p")
              eng.close()
              mod._shutdown_gateway()
          EOF

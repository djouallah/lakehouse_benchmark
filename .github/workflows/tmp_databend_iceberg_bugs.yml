name: tmp databend iceberg bugs

# TEMPORARY. .github/scripts/tmp_databend_iceberg_bugs.py: upstream repros on a local Iceberg REST
# catalog, no lakehouse. Delete once filed.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/djouallah/databend:main-8b1dc20714
          - datafuselabs/databend:v1.2.952-nightly
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Same path in every container. The catalog creates the table directories as its own user,
      # so the script runs as root to read them back.
      - name: Iceberg REST catalog, warehouse file:///tmp/wh
        run: |
          mkdir -p /tmp/wh && chmod 777 /tmp/wh
          docker run -d --name rest -p 8181:8181 -v /tmp/wh:/tmp/wh \
            -e CATALOG_WAREHOUSE=file:///tmp/wh \
            -e CATALOG_IO__IMPL=org.apache.iceberg.hadoop.HadoopFileIO \
            apache/iceberg-rest-fixture:1.9.2
          until curl -fs http://localhost:8181/v1/config; do sleep 2; done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pyiceberg[pyarrow]>=0.12" pymysql
      - run: sudo -E "$(which python)" .github/scripts/tmp_databend_iceberg_bugs.py "${{ matrix.image }}"
      - if: always()
        run: |
          docker logs rest 2>&1 | tail -n 20 || true
          docker logs db 2>&1 | grep -i -E "panic|error" | tail -n 30 || true

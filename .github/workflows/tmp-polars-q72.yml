name: tmp polars q72

# TEMPORARY: TPC-DS Q72 on Polars 2.0.0 over plain parquet, peak RSS, DuckDB for comparison
# (bench run 37469601767 was killed in Q72 at SF=10). Delete with .github/scripts/tmp_polars_q72.py.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sf: ["1", "10"]
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements/polars_iceberg.txt "pyiceberg[sql-sqlite]"
      - uses: ./.github/actions/duckdb-nightly
      - run: python .github/scripts/tmp_polars_q72.py sql
      - run: python .github/scripts/tmp_polars_q72.py ${{ matrix.sf }}

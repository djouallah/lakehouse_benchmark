name: storage token

# THE SITE'S CATALOGS TAB. The test and its secrets live in testing-iceberg-rest-catalog
# (storage_token.py, its storage-token workflow): with only the catalog credentials, can DuckDB write
# one row and read it back? This copies that repo's results/storage_token.json to
# docs/data/storage_token.json, keeping only the catalogs that worked, and commits it if it
# changed. No secrets here.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: storage-token
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      SOURCE: https://raw.githubusercontent.com/djouallah/testing-iceberg-rest-catalog/main/results/storage_token.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - name: Copy and check
        run: |
          curl -fsSL "$SOURCE" -o "$RUNNER_TEMP/storage_token.json"
          python .github/scripts/storage_token_publish.py "$RUNNER_TEMP/storage_token.json"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/storage_token.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "storage token: copy the latest result"
          # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE: the rule etl.yml's publish states.
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/storage_token_publish.py "$RUNNER_TEMP/storage_token.json"
            git add docs/data/storage_token.json
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "storage token: copy the latest result"
          done
          exit 1

name: tmp polars q11

# TEMPORARY: repro TPC-H Q11 `search_sorted ... decimal[38,2] and decimal[38,12]` on Polars 2.0.0
# (bench run 37468610961), against rc2. Delete with .github/scripts/tmp_polars_q11.py.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        polars: ["2.0.0", "2.0.0rc2"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "polars==${{ matrix.polars }}"
      - run: python .github/scripts/tmp_polars_q11.py

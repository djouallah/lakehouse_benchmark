name: tpch bench

# THE JOB GRAPH, and why it has this shape:
#
#   prepare  ->  bench (matrix, one engine at a time)  ->  publish
#
# `prepare` is the SINGLE WRITER of the TPC-H Iceberg tables. Four matrix jobs calling generate()
# would race -- create_table_if_not_exists is check-then-act with a multi-minute window before the
# add_files commit, so two jobs can both decide a table is missing and both register the same
# files. That is a corrupt table, not a slow one.
#
# `publish` is the SINGLE WRITER of results. The bench jobs write local JSON artifacts and nothing
# else; publish merges them into one immutable file. One file per run, never edited, so concurrent
# jobs and overlapping runs cannot produce a merge conflict.
#
# `publish` needs NO Azure credentials at all -- it reads JSON off disk. Hence no id-token
# permission on it, and no azure-identity in requirements/report.txt.

on:
  workflow_dispatch:
    inputs:
      sf:
        description: Scale factor. 1 is the smoke value; 10 is the default. 30, 60, 100 and 300 free the runner's hidden disk first.
        type: choice
        options: ["1", "10", "30", "60", "100", "300"]
        default: "10"
      engines:
        description: Comma-separated engines to run.
        type: string
        default: duckdb_iceberg,chdb_iceberg,polars_iceberg,lakesail_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg
      publish:
        description: Commit results and charts. Off leaves the artifacts and touches nothing.
        type: boolean
        default: true
      override:
        description: A package spec (e.g. a wheel URL) installed over each engine's requirements, no deps. For testing an unreleased build; leave publish off.
        type: string
        default: ""
  # Enable once a manual SF=10 run over all four engines has gone green and the leak check in
  # publish.py has been confirmed clean. See Agent.md, section 4.
  # schedule:
  #   - cron: "17 3 * * *"

# QUEUE, NEVER CANCEL. A cancelled `prepare` can leave a namespace half-generated, and the
# completion marker is only written after every table lands -- so the next run regenerates, which
# is correct but slow. Cancelling mid-generation to start another run is never what you want.
#
# ONE GROUP FOR BOTH BENCHMARKS, the same string as etl.yml: the two workflows share one lakehouse
# and one OneLake pipe, and the engine under test must have that pipe to itself. A run of either
# workflow, at any SF or file count, queues behind whatever is running.
concurrency:
  group: onelake
  cancel-in-progress: false

env:
  # The scripts live in .github/scripts and import `bench` from the repo root, which Python does
  # NOT put on sys.path (it adds the SCRIPT's directory, not the working directory).
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  # Which query suite the shared scripts run (bench/suite.py). tpcds.yml says tpcds.
  BENCH_SUITE: tpch
  TPCH_SF: ${{ inputs.sf || '10' }}
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    # A hang guard sized for the largest scale: SF=100 is ten times SF=10 through one runner.
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/catalog.txt
      - run: pip install -r requirements/catalog.txt

      - id: plan
        # The matrix needs a JSON array; the input is a human-friendly CSV. `started` is stamped
        # once here so every artifact in the run shares one timestamp.
        run: |
          ENGINES=$(printf '%s' "${{ inputs.engines || 'duckdb_iceberg,chdb_iceberg,polars_iceberg,lakesail_iceberg,pyspark_iceberg,pyspark_gluten_iceberg,starrocks_iceberg' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "engines: $ENGINES"

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Generate TPC-H into OneLake (idempotent)
        run: python .github/scripts/prepare.py

  bench:
    needs: prepare
    # Display only -- the checks list reads "bench (duckdb_iceberg)" otherwise. Nothing depends on
    # this string: `needs:` uses the job ID, artifacts and the results JSON use `matrix.engine`.
    # Chained `&&`/`||` is GitHub's ternary; the final `|| matrix.engine` covers a new engine.
    name: >-
      ${{ matrix.engine == 'duckdb_iceberg' && '🦆 DuckDB'
      || matrix.engine == 'chdb_iceberg' && '⚡ chDB'
      || matrix.engine == 'polars_iceberg' && '🐻‍❄️ Polars'
      || matrix.engine == 'lakesail_iceberg' && '⛵ LakeSail'
      || matrix.engine == 'daft_iceberg' && '💠 Daft'
      || matrix.engine == 'pyspark_iceberg' && '✨ Spark-OSS'
      || matrix.engine == 'pyspark_gluten_iceberg' && '🚀 Gluten/Velox'
      || matrix.engine == 'starrocks_iceberg' && '⭐ StarRocks'
      || matrix.engine }}
    runs-on: ubuntu-latest
    # 355, JUST UNDER GITHUB'S 360 CEILING, raised from 50 for SF=30, 60 and 100. The 50 was
    # sized to the token: chDB bakes it into CREATE DATABASE and Sail into an env var, and neither
    # ever asks again, so a job past the hour fails there anyway. But Spark and StarRocks restart
    # or re-attach on a fresh token and their storage re-reads the assertion file, so those can
    # outlive the token -- and a job killed at the cap writes no part at all. A hang still ends;
    # it just ends later.
    timeout-minutes: 355
    permissions:
      id-token: write
      contents: read
    strategy:
      # MANDATORY. A LakeSail OOM must not delete DuckDB's results.
      fail-fast: false
      # ONE ENGINE AT A TIME. The five engines read the same lakehouse, and run in parallel they
      # are five clients contending for the same OneLake throughput -- which is what the numbers
      # measured: on unchanged code, full-matrix runs swung 20-50% between runs for every engine
      # but DuckDB, while an engine run on its own came out a different number again. Serial jobs
      # give each engine the lakehouse to itself, so a run is five measurements of one thing
      # rather than one measurement of five things sharing a pipe. Costs wall clock, not money:
      # the runner minutes are the same. Jobs start in the order the `engines` input lists them.
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(needs.prepare.outputs.engines) }}
    env:
      BENCH_ENGINE: ${{ matrix.engine }}
      # DuckDB's azure extension has its own HTTP stack, and its default transport fails the
      # OneLake TLS handshake on Linux -- the Iceberg ATTACH succeeds (that is the iceberg
      # extension making a plain HTTPS call) and then every data-file read dies with
      # "AzureStorageFileSystem could not open file", which looks exactly like a credential
      # problem and is not one. curl respects the system CA bundle, which is what the second
      # variable points at. Same pair djouallah/dbt-fabric sets on its runner jobs.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Local-mode Spark: the driver JVM IS the executor and its heap is fixed before Python
      # starts it, so .config("spark.driver.memory") is silently ignored and this must be env.
      SPARK_DRIVER_MEMORY: 11g
    steps:
      # BIG SCALES NEED THE DISK THE RUNNER HIDES, as in tpcds.yml. DuckDB spills beside the
      # workspace and the engines' local caches live under $RUNNER_TEMP, both on `/`; deleting the
      # preinstalled toolchains nobody here uses frees ~30 GB. SF=1/10 skip this.
      # Spark and Gluten/Velox spill under SPARK_LOCAL_DIRS, which defaults to /tmp on `/`; the
      # temporary disk at /mnt (~70 GB, otherwise unused) takes it instead, as in tpcds.yml.
      - name: Free runner disk (SF >= 30)
        if: contains(fromJSON('["30","60","100","300"]'), inputs.sf || '10')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/spark && sudo chown "$USER" /mnt/spark
          echo "SPARK_LOCAL_DIRS=/mnt/spark" >> "$GITHUB_ENV"
          df -h / /mnt
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.engine }}.txt

      # One self-contained file per engine. Which line it tracks -- pre-release for duckdb and
      # polars, stable for chdb and pysail -- is a property of that file, not a workflow input.
      - name: Install ${{ matrix.engine }}
        env:
          OVERRIDE: ${{ inputs.override }}
        run: |
          pip install -r "requirements/${BENCH_ENGINE}.txt"
          if [ -n "$OVERRIDE" ]; then pip install --force-reinstall --no-deps "$OVERRIDE"; fi
          pip list --format=freeze | grep -Ei '^(duckdb|chdb|polars|pysail|pyiceberg|pyarrow)=' || true

      - uses: actions/setup-java@v5
        if: startsWith(matrix.engine, 'pyspark')
        with:
          distribution: temurin
          java-version: "17"

      # spark.jars.packages resolves iceberg-spark-runtime + hadoop-azure from Maven at every
      # SparkSession start; without this it is a fresh download per job.
      - uses: actions/cache@v4
        if: startsWith(matrix.engine, 'pyspark')
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # StarRocks is a container, not a wheel (bench/starrocks.py). Pull it here, OUTSIDE the
      # timer, so the setup row measures a cold start and not a multi-GB download.
      - name: Pull the StarRocks image
        if: matrix.engine == 'starrocks_iceberg'
        run: docker pull "$(python -c 'from bench.starrocks import IMAGE; print(IMAGE)')"

      - name: Run 22 queries, one cold pass
        # `shell: bash` is NOT cosmetic here. The default Linux shell is `bash -e {0}` with NO
        # pipefail, so the exit status of `... | tee` is tee's -- always 0. That silently defeated
        # run_engine.py's "attached but completed 0 statements" guard: LakeSail died in setup and
        # Polars failed all 44 queries, and both jobs reported a green check. `shell: bash` is
        # `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        run: python .github/scripts/run_engine.py parts 2>&1 | tee "${{ matrix.engine }}.log"

      # The server may log statement text, and the catalog DDL carries the bearer. Python mints
      # it, so ::add-mask:: cannot cover it -- redact JWT shapes.
      - name: StarRocks server log
        if: always() && matrix.engine == 'starrocks_iceberg'
        run: |
          docker logs starrocks 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-${{ matrix.engine }}
          path: |
            parts/*.json
            ${{ matrix.engine }}.log
          if-no-files-found: warn

  publish:
    needs: [prepare, bench]
    # !cancelled(): an engine that failed to attach should not stop the others being published,
    # but a CANCELLED run must publish nothing -- `always()` also runs on cancellation, and a
    # half-finished matrix is not a measurement of anything.
    # (wrapped in ${{ }}: a bare leading `!` is a YAML tag indicator, not an expression.)
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.publish != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # No id-token: this job never talks to Azure.
    concurrency:
      group: bench-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      BENCH_RUN_STARTED_AT: ${{ needs.prepare.outputs.started }}
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - uses: actions/download-artifact@v6
        with:
          pattern: bench-*
          merge-multiple: true
          path: parts

      - name: Merge, chart, and write the table view
        run: python .github/scripts/publish.py parts

      - name: Commit results and charts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop.
        #
        # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE. Run 35550043819 lost six green engines
        # to `git pull --rebase`: another publish had landed the same four generated paths while
        # this ran, so the rebase hit add/add conflicts (two of them PNGs) and the step died with
        # the measurements still in the artifact. Nothing under results/ or docs/ here is
        # hand-written -- every byte is a function of results/**/*.json, and the history files
        # (the flattened CSV, the charts, the table view) are a function of ALL runs -- so even
        # where git could merge two generators' output, the merge would be wrong. So: drop this
        # attempt, reset onto origin/main (which now HAS the other run's JSON) and generate again.
        # parts/ is untracked, so the artifacts survive the reset.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add results docs
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "bench: SF=${TPCH_SF} results for run ${{ github.run_id }}"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python .github/scripts/publish.py parts
          done
          echo "::error::could not push after 3 attempts"
          exit 1

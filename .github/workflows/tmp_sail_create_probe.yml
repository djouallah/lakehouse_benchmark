name: temporary sail create probe

# TEMPORARY: .github/scripts/tmp/sail_create_probe.py. Whether Sail main still creates Iceberg
# tables with last-partition-id -1 (which DuckDB 2.0.1 refuses): three small tables in
# _bench_probe, read, then dropped. In the workload queue so it runs between two builds. Deleted
# once reported.

on:
  workflow_dispatch:

concurrency:
  group: workload
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install azure-identity
      - run: python .github/scripts/tmp/sail_create_probe.py

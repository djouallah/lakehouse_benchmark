name: tmp_duckdb_main_plans

# TEMPORARY. TPC-DS Q19 and Q64 plans at SF=100 on DuckDB's main nightly Main (alpha49809), run
# 39881189456, which has duckdb/duckdb#27493: <> joins estimated as nearly a cross product instead
# of dividing by tdom^(2/3). v2.0.0 does not have it (backport to v2.0-cyanoptera pending). Same
# job as plans.yml for duckdb_iceberg; only the CLI differs. Compare with plans run 38057700184.

on:
  workflow_dispatch:
    inputs:
      queries:
        description: Comma-separated query numbers, run in this order.
        type: string
        default: "19,64"

concurrency:
  group: onelake
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  BENCH_SUITE: tpcds
  BENCH_ENGINE: duckdb_iceberg
  TPCH_SF: "100"
  TPCDS_SF: "100"
  PLAN_QUERIES: ${{ inputs.queries }}
  PLAN_WARMUP: "false"
  DUCKDB_RUN_ID: "39881189456"
  BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  # bench.yml says why, for each.
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/duckdb_iceberg.txt
      - run: pip install -r requirements/duckdb_iceberg.txt

      - name: Install the DuckDB main nightly CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/duckdb-cli"
          mkdir -p "$dir"
          gh run download "$DUCKDB_RUN_ID" --repo duckdb/duckdb \
            --name duckdb-cli-linux-amd64.tar.gz --dir "$dir"
          tar -xzf "$dir/duckdb-cli-linux-amd64.tar.gz" -C "$dir"
          chmod +x "$dir/duckdb"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/duckdb" --version
          "$dir/duckdb" -batch -c "INSTALL iceberg; INSTALL avro; INSTALL azure; INSTALL httpfs;"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Capture plans
        shell: bash
        run: python .github/scripts/capture_plan.py plans_raw 2>&1 | tee capture.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plans-duckdb_iceberg-main-sf100
          path: |
            plans_raw/*.json
            capture.log
          if-no-files-found: warn

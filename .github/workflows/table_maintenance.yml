name: table maintenance

# THE WORKLOAD'S TABLE MAINTENANCE, once a day: every dbt_<engine>_{landing,mart} table the dbt
# workload merges into is compacted to 128 MiB files, its snapshots older than a day are expired
# and its orphan files older than 3 days deleted, all three by apache/iceberg-go
# (.github/scripts/maintain). workload_maintain.py publish turns the record into the Real
# workload tab's counts (docs/data/maintenance.json).
#
# AND THE WORKLOAD'S dbt TESTS, here and nowhere else (the analytics-as-code pattern): the hourly
# builds only build. Every hour they re-checked all history, and one grain test took 1,053 s of
# Trino's 1,431 s build (run 40050741886). Once a day DuckDB runs the duckdb tree's tests against
# every leg's tables (workload_test.py), before the compaction, so a failing test is a finding on
# the page and never blocks a build. Rows, files processed and SUM(mw) stay in every hourly run.
#
# NEVER CONCURRENT WITH THE DATA PROCESSING: the workload's own `workload` queue.
# A rewrite commits optimistically, so overlapping a leg's merge would fail one
# side. The group keeps ONE pending run: 22:05 normally starts between two workload runs and the
# 22:23 one queues behind it; when the previous workload overruns, this run waits pending and the
# 22:23 workload replaces it -- that day's maintenance is skipped, the next day's catches up.

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit results/maintenance/<run>.json and the Real workload tab's data (docs/data/maintenance.json). Scheduled runs always publish.
        type: boolean
        default: false

concurrency:
  group: workload
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  dbt_test:
    name: 🧪 dbt tests, every leg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # The grain tests group 386M rows: DuckDB's spill goes to /mnt, as in the builds.
      DUCKDB_TEMP_DIR: /mnt/duckdb_spill
    steps:
      - name: Spill directory
        run: sudo mkdir -p /mnt/duckdb_spill && sudo chown "$USER" /mnt/duckdb_spill
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/workload_duckdb.txt
      - run: pip install -r requirements/workload_duckdb.txt
      # A failing ATTACH can quote the bearer: redact JWT and SAS shapes on the way to the log.
      - name: dbt test, every leg's tables
        shell: bash
        run: |
          python .github/scripts/workload_test.py workload_tests.json 2>&1 \
            | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workload-tests
          path: workload_tests.json
          if-no-files-found: warn

  compact:
    name: 🧹 compact, expire, remove orphans
    # After the tests, which read the tables as the builds left them; a failed test still compacts.
    needs: dbt_test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
    env:
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMPACT_BUDGET_MINUTES: "70"
      EXPIRE_OLDER_THAN_DAYS: "1"
      ORPHAN_OLDER_THAN_DAYS: "3"
      # Outside the checkout: the commit loop resets the tree onto main.
      RECORD: /tmp/maintenance.json
      TESTS: /tmp/workload_tests/workload_tests.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/scripts/maintain/go.mod
          cache-dependency-path: .github/scripts/maintain/go.mod
      - name: Build the maintenance job (iceberg-go)
        working-directory: .github/scripts/maintain
        run: go mod tidy && go build -o "$RUNNER_TEMP/maintain" .

      # Its own timeout, under the job's, so the record of what was done still gets published.
      # It mints its own bearer from the GitHub OIDC endpoint: redact JWT and SAS shapes anyway.
      - name: Maintain the workload tables
        timeout-minutes: 100
        shell: bash
        run: |
          "$RUNNER_TEMP/maintain" "$RECORD" 2>&1 \
            | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

      - uses: actions/download-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: workload-tests
          path: /tmp/workload_tests

      - name: Summarise
        if: always()
        run: '[ -f "$RECORD" ] && python .github/scripts/workload_maintain.py publish "$RECORD" --tests "$TESTS" || echo "no record"'

      - name: Commit results/maintenance
        if: always() && (inputs.publish || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          [ -f "$RECORD" ] || { echo "no record"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # As workload.yml's grade job: fetch, reset, regenerate from the record, push; again on a race.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python .github/scripts/workload_maintain.py publish "$RECORD" --tests "$TESTS" --write > /dev/null
            git add results/maintenance docs/data/maintenance.json
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            git commit -q -m "table maintenance: results for run ${{ github.run_id }}"
            git push -q && exit 0
            sleep $((attempt * 5))
          done
          exit 1

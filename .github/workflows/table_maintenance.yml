name: table maintenance

# THE WORKLOAD'S TABLE MAINTENANCE, once a day: every dbt_<engine>_{landing,mart} table the dbt
# workload merges into is compacted to 128 MiB files, its snapshots older than a day are expired
# and its orphan files older than 3 days deleted (workload_maintain.py). The Real workload tab
# shows the counts (docs/data/maintenance.json).
#
# NEVER CONCURRENT WITH THE DATA PROCESSING: the workload's own `workload` queue.
# iceberg_rewrite_data_files commits optimistically, so overlapping a leg's merge would fail one
# side. The group keeps ONE pending run: 22:05 normally starts between two workload runs and the
# 22:23 one queues behind it; when the previous workload overruns, this run waits pending and the
# 22:23 workload replaces it -- that day's maintenance is skipped, the next day's catches up.

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit results/maintenance/<run>.json and the Real workload tab's data (docs/data/maintenance.json). Scheduled runs always publish.
        type: boolean
        default: false

concurrency:
  group: workload
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  compact:
    name: 🧹 compact, expire, remove orphans
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: write
    env:
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMPACT_BUDGET_MINUTES: "70"
      EXPIRE_OLDER_THAN_DAYS: "1"
      ORPHAN_OLDER_THAN_DAYS: "3"
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      DUCKDB_TEMP_DIR: /mnt/duckdb_spill
      # Outside the checkout: the commit loop resets the tree onto main.
      RECORD: /tmp/maintenance.json
    steps:
      - run: sudo mkdir -p /mnt/duckdb_spill && sudo chown "$USER" /mnt/duckdb_spill
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/maintenance.txt
      - run: |
          pip install -r requirements/maintenance.txt
          pip list --format=freeze | grep -Ei '^(duckdb|pyiceberg|adlfs)' || true

      # The orphan pass lists the table folders through adlfs, whose credential falls back to
      # azure-identity's default chain (the dbt-polars leg's reason in workload.yml).
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Its own timeout, under the job's, so the record of what was done still gets published.
      # The ATTACH carries the bearer: redact JWT and SAS shapes on the way to the log.
      - name: Maintain the workload tables
        timeout-minutes: 100
        shell: bash
        run: |
          python .github/scripts/workload_maintain.py run "$RECORD" 2>&1 \
            | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

      - name: Summarise
        if: always()
        run: '[ -f "$RECORD" ] && python .github/scripts/workload_maintain.py publish "$RECORD" || echo "no record"'

      - name: Commit results/maintenance
        if: always() && (inputs.publish || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          [ -f "$RECORD" ] || { echo "no record"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # As workload.yml's grade job: fetch, reset, regenerate from the record, push; again on a race.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python .github/scripts/workload_maintain.py publish "$RECORD" --write > /dev/null
            git add results/maintenance docs/data/maintenance.json
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            git commit -q -m "table maintenance: results for run ${{ github.run_id }}"
            git push -q && exit 0
            sleep $((attempt * 5))
          done
          exit 1

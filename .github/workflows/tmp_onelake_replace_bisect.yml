name: tmp onelake replace bisect

# TEMPORARY: replays Iceberg Java's replace commit (Spark's CREATE OR REPLACE TABLE ... AS)
# against the OneLake REST catalog, one change at a time, to find what it refuses
# (.github/scripts/tmp/onelake_replace_bisect.py). Deleted once that is known.
on:
  workflow_dispatch:

concurrency:
  group: onelake
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/capability_pyiceberg.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/tmp/onelake_replace_bisect.py

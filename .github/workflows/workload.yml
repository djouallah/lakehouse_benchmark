name: dbt workload

# THE "MY WORKLOAD" TEST: the fabric-dbt-examples dbt project (workload/, see workload/SOURCE),
# run by bench on its own engines and auth, Iceberg only.
#
#   land  ->  dbt-Iceberg (matrix: duckdb, polars, gluten, trino, sail; one at a time)  ->  grade
#
# ON A SCHEDULE, EVERY HOUR, NEVER RESET: new AEMO files land every run and each engine folds
# process_limit of them into its own tables, which only grow. The Real workload tab shows how far
# each engine has got -- files behind, peak RSS -- and an engine whose runner dies (out of memory)
# stays on the page as "died", carried forward from the last run (workload_publish.py).
#
# `land` is the SINGLE WRITER of Files/dbt (the CSVs and the archive-log parquet the models select
# files from). Each leg writes its own namespaces, dbt_<engine>_landing / dbt_<engine>_mart.

on:
  schedule:
    # Hourly since 2026-10-23, for Polars' and Sail's catch-up. A run that outlasts the hour queues
    # behind the one in progress (the group keeps one pending); nothing is lost, the builds are
    # incremental.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      engines:
        description: Comma-separated dbt targets (duckdb, polars, gluten, trino, sail).
        type: string
        default: duckdb,polars,gluten,trino,sail
      process_limit:
        description: Files each fact model folds per run, newest first. A backlog converges over runs.
        type: string
        default: "50"
      process_limits:
        description: Per-engine files a run, e.g. "gluten=100,trino=150"; empty uses each engine's proven batch (gluten=360,duckdb=360,trino=100,polars=50,sail=100). Engines not named use process_limit.
        type: string
        default: ""
      daily_download_limit:
        description: Daily archive files the landing adds per run (360 keeps pace with the largest batch).
        type: string
        default: "360"
      download_limit:
        description: Intraday files per feed the landing adds per run (nemweb throttles bursts).
        type: string
        default: "6"
      reset:
        description: Drop every dbt_<engine>_* table first, so all legs start from empty and share one history. Not a full refresh -- the builds stay incremental.
        type: boolean
        default: false
      reset_tables:
        description: With reset, drop only these tables, as engine.table (e.g. "duckdb.fct_summary,polars.fct_summary"); the next run rebuilds them from the facts. Empty drops every table.
        type: string
        default: ""
      publish:
        description: Commit results/workload/<run>.json and the Real workload tab's data (docs/data/workload.json). Off leaves the artifacts and touches nothing. Scheduled runs always publish.
        type: boolean
        default: false

# Its own queue, not the benchmarks' `onelake` one: that group keeps a single pending run, and a
# scheduled workload run sitting in it would cancel a pending manual benchmark. QUEUE, NEVER CANCEL.
concurrency:
  group: workload
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/workload_land.txt
      - run: pip install -r requirements/workload_land.txt

      # CATCH-UP: on the schedule, while Polars or Sail is behind (files_behind in the last published
      # run), only those two run; duckdb, gluten and trino are already at 0 and resume once both
      # are. A leg that does not run keeps its last result on the page (workload_publish.py).
      # A manual dispatch runs exactly the engines it names.
      - id: plan
        run: |
          ENGINES="${{ inputs.engines }}"
          if [ -z "$ENGINES" ]; then
            ENGINES=duckdb,polars,gluten,trino,sail
            BEHIND=$(jq -r '[.legs.polars_iceberg.files_behind, .legs.lakesail_iceberg.files_behind] | map(. // 0) | add' docs/data/workload.json)
            if [ "${BEHIND:-0}" -gt 0 ]; then
              ENGINES=polars,sail
              echo "catch-up: Polars and Sail are $BEHIND files behind together; duckdb, gluten and trino wait"
            fi
          fi
          ENGINES=$(printf '%s' "$ENGINES" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "engines: $ENGINES"

      - name: Land the AEMO files into Files/dbt (idempotent)
        env:
          DOWNLOAD_LIMIT: ${{ inputs.download_limit || '6' }}
          DAILY_DOWNLOAD_LIMIT: ${{ inputs.daily_download_limit || '360' }}
          # The GitHub mirror listing is a contents-API call per year; anonymous is 60/hour.
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/workload_land.py

  # Opt-in, before any leg: see workload_reset.py.
  reset:
    needs: land
    if: inputs.reset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/catalog.txt
      - run: pip install -r requirements/catalog.txt
      - name: Drop the legs' tables
        env:
          RESET_TABLES: ${{ inputs.reset_tables }}
        run: python .github/scripts/workload_reset.py

  dbt-Iceberg:
    needs: [land, reset]
    # Runs after reset, or without it when reset was not asked for (skipped is fine, failed is not).
    if: ${{ !cancelled() && needs.land.result == 'success' && needs.reset.result != 'failure' }}
    name: >-
      ${{ matrix.engine == 'duckdb' && '🦆 dbt-duckdb'
      || matrix.engine == 'polars' && '🐻‍❄️ dbt-polars'
      || matrix.engine == 'gluten' && '🚀 dbt-spark on Gluten/Velox'
      || matrix.engine == 'trino' && '🐰 dbt-trino'
      || matrix.engine == 'sail' && '⛵ dbt-spark on LakeSail'
      || matrix.engine }}
    runs-on: ubuntu-latest
    # The OneLake bearer is baked into the profile (DuckDB's ATTACH, pyiceberg's catalog) and
    # Gluten's SAS lives an hour; nothing renews either inside a dbt build.
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(needs.land.outputs.engines) }}
    env:
      BENCH_ENGINE: ${{ matrix.engine }}
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      process_limit: ${{ inputs.process_limit || '50' }}
      # Each engine's largest batch that holds on the schedule as its tables grow (2026-10-21):
      # Spark 360 (39403578519), DuckDB 360 with the TEMP VIEW batch (39427985965), Trino 100 (its
      # 9 GB per-query cap failed 360), Polars 50: at 75 the runner died (39493139124). Sail 100 since
      # 2026-10-23: with the DATE IN prune, 50 files spilled 22.2 GB of the 64 GB cap (39849807698);
      # 360 spilled 57.3 GB before the prune (39711280954). Back to 50 if 100 fails.
      PROCESS_LIMITS: ${{ inputs.process_limits || 'gluten=360,duckdb=360,trino=100,polars=50,sail=100' }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      DUCKDB_TEMP_DIR: /mnt/duckdb_spill
      # Spark's shuffle and Gluten's spill (spark.local.dir, /tmp by default) go to /mnt too: /tmp has
      # a quota, and fct_summary's shuffle hit "Disk quota exceeded" there at 360 and at 100 files
      # (39458720133 ... 39524954142), with 106 GB free on the volume -- DuckDB's spill hit the same.
      SPARK_LOCAL_DIRS: /mnt/spark_spill
      # Polars' streaming engine spills (out-of-core). At 360 files a run fct_scada passed its
      # default 64 GB budget (run 39403578519); the volume has ~105 GB free after "Free disk".
      # /mnt is a directory on that same volume, not a second disk (tpcds.yml).
      POLARS_TEMP_DIR: /mnt/polars_spill
      POLARS_OOC_DISK_BUDGET_MB: "100000"
      # fct_summary took the 16 GB runner down at 50 files a run (39602045106); the passing runs
      # before it peaked at 14.7-14.8 GB (39585596206, 39571081210). A budget makes the streaming
      # engine spill to POLARS_TEMP_DIR before that; experimental (LEARNING.md, run 36238938131).
      POLARS_OOC_MEMORY_BUDGET_MB: "10000"
    steps:
      # Room for the engines' spill (DuckDB's temp dir, Spark's shuffle, Trino's spill) as the
      # tables grow: the toolchains this job never uses, as bench.yml does at SF>=30.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/duckdb_spill /mnt/polars_spill /mnt/spark_spill /mnt/sail_spill && sudo chown "$USER" /mnt/duckdb_spill /mnt/polars_spill /mnt/spark_spill /mnt/sail_spill
          df -h / /mnt
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/workload_${{ matrix.engine }}.txt
      - name: Install ${{ matrix.engine }}
        run: |
          pip install -r "requirements/workload_${BENCH_ENGINE}.txt"
          pip list --format=freeze | grep -Ei '^(dbt-|duckdb|polars|pyspark|pyiceberg)' || true

      # The profile's bearer comes from bench.auth (OIDC), but dbt-polars' TESTS read the tables
      # back through pyiceberg's ADLS FileIO with no credential of its own, which falls back to
      # azure-identity's default chain: ManagedIdentityCredential "Identity not found" on a runner
      # (workload run 39334923350) unless the Azure CLI is logged in. fabric-dbt-examples' legs
      # all run azure/login for this.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: actions/setup-java@v5
        if: matrix.engine == 'gluten'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        if: matrix.engine == 'gluten'
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1

      # Sail spills to the OS temp dir, and /tmp has a quota: fct_scada's merge failed "Disk quota
      # exceeded (os error 122)" (run 39691469943). Sail's leg only: an empty TMPDIR elsewhere would
      # not mean /tmp to every engine.
      - name: Sail's spill on /mnt
        if: matrix.engine == 'sail'
        run: echo "TMPDIR=/mnt/sail_spill" >> "$GITHUB_ENV"

      # The official image bench/trino.py pins, pulled before the build.
      - name: Pull the Trino image
        if: matrix.engine == 'trino'
        run: docker pull "$(python -c 'from bench.trino import IMAGE; print(IMAGE)')"

      - name: dbt build (${{ matrix.engine }})
        # pipefail via `shell: bash`. dbt prints its own errors straight to stdout, unscrubbed, and
        # a failing ATTACH can quote the bearer: redact JWT and SAS shapes on the way to the log.
        shell: bash
        run: |
          python .github/scripts/workload_run_engine.py parts 2>&1 \
            | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g' \
            | tee "workload_${{ matrix.engine }}.log"

      # The catalog DDL carries the bearer: redact JWT shapes.
      - name: Trino server log
        if: always() && matrix.engine == 'trino'
        run: |
          docker logs trino 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workload-${{ matrix.engine }}
          path: |
            parts/*.json
            workload_${{ matrix.engine }}.log
            workload/target/run_results.json
            workload/logs/dbt.log
          if-no-files-found: warn

  grade:
    needs: [land, dbt-Iceberg]
    if: ${{ !cancelled() && needs.land.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BENCH_RUN_STARTED_AT: ${{ needs.land.outputs.started }}
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The engines this run asked for: one with no part had its runner killed ("died").
      WORKLOAD_ENGINES: ${{ needs.land.outputs.engines }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          pattern: workload-*
          merge-multiple: true
          path: artifacts
      - name: Summarise the legs
        run: python .github/scripts/workload_publish.py artifacts/parts ${{ (inputs.publish || github.event_name == 'schedule') && '--write' || '' }}
      - name: Commit results/workload
        if: (inputs.publish || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/data/workload.json is rebuilt FROM the latest main's copy (the carried-forward
          # engines), never rebased: another run publishing first would conflict on it
          # (run 39403578519). Fetch, reset, regenerate from this run's parts, push; again on a race.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python .github/scripts/workload_publish.py artifacts/parts --write > /dev/null
            git add results/workload docs/data/workload.json
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            git commit -q -m "workload: results for run ${{ github.run_id }}"
            git push -q && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      # Last, so a failure still leaves the summary and the record: the run is red when a leg
      # failed or its runner died.
      - name: Verdict
        run: python .github/scripts/workload_publish.py artifacts/parts --check > /dev/null


name: temporary sail main wheel

# UNTIL THE NEXT SAIL RELEASE. Sail publishes no nightly wheels; this builds main the way their
# release.yml does (maturin --release, manylinux, protoc inside the container) for Linux x86_64
# only, and attaches the wheel to a prerelease of this repo so requirements/lakesail_iceberg.txt
# runs it until PyPI has a release with lakehq/sail#2753 (spill-file compression, cached Parquet
# footers). Deleted then.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: lakehq/sail ref to build.
        type: string
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lakehq/sail
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          args: --release --out dist --interpreter python3.11
          rustup-components: rustfmt
          manylinux: auto
          before-script-linux: |
            protoc_version="${{ steps.protoc.outputs.version }}"
            yum install -y wget unzip pkgconfig
            wget -q -O /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version#v}/protoc-${protoc_version#v}-linux-x86_64.zip"
            unzip /tmp/protoc.zip -d /usr/local 'bin/*' 'include/*'
            rm /tmp/protoc.zip
            protoc --version
      - name: Import check
        run: |
          pip install dist/*.whl pyspark-client
          python -c 'import pysail; print(pysail.__version__)' || pip show pysail
          SAIL_RUNTIME__TEMPORARY_FILES__COMPRESSION=zstd python -c '
          from pysail.spark import SparkConnectServer
          from pyspark.sql import SparkSession
          s = SparkConnectServer(); s.start()
          spark = SparkSession.builder.remote(f"sc://localhost:{s.listening_address[1]}").getOrCreate()
          print(spark.sql("SELECT 1 AS ok").collect())
          s.stop()'
          ls -la dist
      - name: Attach to a prerelease of this repo
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          tag="sail-main-${SHA:0:10}"
          gh release create "$tag" dist/*.whl --repo "${{ github.repository }}" --prerelease \
            --title "$tag (temporary)" --notes "Sail main at lakehq/sail@$SHA, built for the bench."

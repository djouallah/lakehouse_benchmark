name: temporary sail main wheel

# UNTIL THE NEXT SAIL RELEASE. Sail publishes no nightly wheels; this builds main the way their
# release.yml does (maturin --release, manylinux, protoc inside the container) for Linux x86_64
# only, and attaches the wheel to a prerelease of this repo so requirements/lakesail_iceberg.txt
# runs it until PyPI has a release with lakehq/sail#2753 (spill-file compression, cached Parquet
# footers). Deleted then.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: lakehq/sail ref to build.
        type: string
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lakehq/sail
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Main still calls itself 0.7.2, the PyPI release it lacks #2753 against. Renumber it as a
      # dev build of the next release, dated by the commit, so results and the engine's version
      # gate (bench/tpch/engines/lakesail_iceberg.py) can tell the two apart.
      - name: Renumber
        run: |
          base="$(sed -n 's/^version = "\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)"$/\1.\2.\3/p' pyproject.toml)"
          next="$(echo "$base" | awk -F. '{print $1"."$2"."$3+1}').dev$(git log -1 --format=%cd --date=format:%Y%m%d)"
          sed -i "s/^version = \"$base\"$/version = \"$next\"/" pyproject.toml
          grep -n '^version' pyproject.toml
          grep -q "^version = \"$next\"" pyproject.toml
      - uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          args: --release --out dist --interpreter python3.11
          rustup-components: rustfmt
          manylinux: auto
          before-script-linux: |
            protoc_version="${{ steps.protoc.outputs.version }}"
            yum install -y wget unzip pkgconfig
            wget -q -O /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version#v}/protoc-${protoc_version#v}-linux-x86_64.zip"
            unzip /tmp/protoc.zip -d /usr/local 'bin/*' 'include/*'
            rm /tmp/protoc.zip
            protoc --version
      - uses: actions/upload-artifact@v4
        with:
          name: pysail-wheel
          path: dist/*.whl
      # The server validates its config at start: 0.7.2 refuses the compression key with
      # "unknown field", so a clean start and stop is the check that matters.
      - name: Import check
        run: |
          pip install dist/*.whl
          pip show pysail | grep '^Version: .*\.dev'
          SAIL_RUNTIME__TEMPORARY_FILES__COMPRESSION=zstd python -c '
          from pysail.spark import SparkConnectServer
          s = SparkConnectServer(); s.start(); print("listening on", s.listening_address); s.stop()'
          # Informational: a bad value should be refused, which shows the start does validate.
          SAIL_RUNTIME__TEMPORARY_FILES__COMPRESSION=bogus python -c '
          from pysail.spark import SparkConnectServer
          s = SparkConnectServer(); s.start(); s.stop()' && echo "bogus value ACCEPTED" || echo "bogus value refused"
          ls -la dist
      - name: Attach to a prerelease of this repo
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          tag="sail-main-${SHA:0:10}"
          gh release create "$tag" dist/*.whl --repo "${{ github.repository }}" --prerelease \
            --title "$tag (temporary)" --notes "Sail main at lakehq/sail@$SHA, built for the bench."

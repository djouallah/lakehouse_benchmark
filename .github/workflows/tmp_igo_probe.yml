name: temporary iceberg-go probe

# TEMPORARY: .github/scripts/tmp/igo_probe against apache/iceberg-go main. Compacts, expires and
# removes orphans on a scratch table (tmp_igo_probe.t), and dry-runs the plans on a few workload
# tables -- nothing on a workload table is written. Main only: the OIDC trust is main.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: apache/iceberg-go commit or branch
        type: string
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build against iceberg-go ${{ inputs.ref }}
        working-directory: .github/scripts/tmp/igo_probe
        run: |
          go mod init probe
          go get github.com/apache/iceberg-go@${{ inputs.ref }}
          go mod tidy
          grep apache/iceberg-go go.mod
          go build -o probe .
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Probe
        env:
          WAREHOUSE: ${{ secrets.FABRIC_WORKSPACE_ID }}/${{ secrets.FABRIC_LAKEHOUSE_ID }}
        shell: bash
        run: |
          export ONELAKE_TOKEN=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::$ONELAKE_TOKEN"
          .github/scripts/tmp/igo_probe/probe 2>&1 \
            | sed -uE 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

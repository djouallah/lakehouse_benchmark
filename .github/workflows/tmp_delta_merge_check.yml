name: temporary delta merge check

# TEMPORARY, READ-ONLY: .github/scripts/tmp/delta_merge_check.py against the polars_delta leg's
# fct_scada, after the dbt-polars#68 fork build's appends: duplicated keys, and the stats of the
# committed files. Writes nothing. In the workload queue so it reads between two builds.
# Deleted once the fix is upstream.

on:
  workflow_dispatch:

concurrency:
  group: workload
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  POLARS_TEMP_DIR: /mnt/polars_spill
  POLARS_OOC_MEMORY_BUDGET_MB: "10000"
  POLARS_OOC_DISK_BUDGET_MB: "100000"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Spill directory
        run: sudo mkdir -p /mnt/polars_spill && sudo chown "$USER" /mnt/polars_spill
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install polars==2.2.0 deltalake==1.7.0 azure-identity psutil
      - run: python .github/scripts/tmp/delta_merge_check.py

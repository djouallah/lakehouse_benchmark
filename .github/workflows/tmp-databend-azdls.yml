name: tmp databend azdls

# TEMPORARY. Builds databend-query from djouallah/databend@fix/iceberg-azure-file-io (Iceberg reads
# on abfss: iceberg-rust storage-azdls + IcebergFileIO authority fix), then runs the candidate
# probe on the stock nightly image with that binary swapped in. Delete once read.
# DATABEND_RELEASE_VERSION: the build refuses to guess a version without git tags, and the query
# must handshake with the image's v1.2.949 databend-meta.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of djouallah/databend to build.
        type: string
        default: fix/iceberg-azure-file-io
      binary_run:
        description: Reuse databend-query from this earlier run's artifact; empty builds it.
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    if: inputs.binary_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/target && sudo chmod 777 /mnt/target
          df -h / /mnt
      - uses: actions/checkout@v5
        with:
          repository: djouallah/databend
          ref: ${{ inputs.ref }}
          path: databend
      # Databend's own build image (clang + mold + protoc + the pinned nightly toolchain).
      # Release, but no LTO and parallel codegen: this binary is for a correctness gate.
      - name: Build databend-query
        run: |
          docker run --rm -v "$PWD/databend:/workspace" -v /mnt/target:/target -w /workspace \
            -e CARGO_TARGET_DIR=/target -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always \
            -e DATABEND_RELEASE_VERSION=v1.2.949-nightly \
            -e CARGO_PROFILE_RELEASE_DEBUG=0 -e CARGO_PROFILE_RELEASE_LTO=off \
            -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 -e CARGO_PROFILE_RELEASE_OPT_LEVEL=2 \
            -e RUSTFLAGS="-C target-feature=+sse4.2 -C link-arg=-fuse-ld=mold" \
            datafuselabs/build-tool:debian-nightly-2026-08-28 \
            bash -c "cargo build --release --bin databend-query && strip /target/release/databend-query"
          ls -lh /mnt/target/release/databend-query
      - uses: actions/upload-artifact@v4
        with:
          name: databend-query
          path: /mnt/target/release/databend-query
          retention-days: 3
      - name: Unit test (IcebergFileIO) and fmt
        run: |
          docker run --rm -v "$PWD/databend:/workspace" -v /mnt/target:/target -w /workspace \
            -e CARGO_TARGET_DIR=/target -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always \
            -e DATABEND_RELEASE_VERSION=v1.2.949-nightly \
            -e CARGO_PROFILE_RELEASE_DEBUG=0 -e CARGO_PROFILE_RELEASE_LTO=off \
            -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 -e CARGO_PROFILE_RELEASE_OPT_LEVEL=2 \
            -e RUSTFLAGS="-C target-feature=+sse4.2 -C link-arg=-fuse-ld=mold" \
            datafuselabs/build-tool:debian-nightly-2026-08-28 \
            bash -c "cargo fmt --all --check && cargo test --release -p databend-common-storage --lib iceberg_file_io"

  probe:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The shared lakehouse queue, as candidate_engine.yml.
    concurrency:
      group: onelake
      cancel-in-progress: false
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      BENCH_SUITE: tpch
      TPCH_SF: "10"
      CANDIDATE_IMAGE: databend-fix:local
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: databend-query
          path: fix
          run-id: ${{ inputs.binary_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Image with the fixed binary
        run: |
          chmod +x fix/databend-query
          printf 'FROM datafuselabs/databend:v1.2.949-nightly\nCOPY databend-query /usr/bin/databend-query\n' > fix/Dockerfile
          docker build -t databend-fix:local fix
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/catalog.txt
            requirements/candidate.txt
      - run: pip install -r requirements/catalog.txt -r requirements/candidate.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/candidate_engine.py databend
      - name: Candidate server log
        if: always()
        run: |
          docker logs candidate 2>&1 | tail -n 300 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g; s/sig=[A-Za-z0-9%+\/=]+/sig=***REDACTED***/g'

name: auth smoke

# RUN THIS FIRST, and run it whenever anything about the credential changes.
#
# Five separate settings, in five different places, all have to be right before a benchmark can do
# anything -- and from inside a 25-minute run they all look like the same 401. This job isolates
# each one and takes about a minute. See .github/scripts/auth_smoke.py for what each probe proves.
#
# It creates a `_bench_probe` namespace and leaves it behind: deleting requires more permission
# than creating, and a probe that needs elevated rights to tidy up is worse than a stray empty
# namespace.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      # Identical to the bench job, so probe 5 exercises the transport the benchmark will
      # actually use. Testing a different one would make the probe worthless.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      TPCH_SF: ${{ vars.TPCH_SF || '10' }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/catalog.txt
            requirements/duckdb_iceberg.txt
      # catalog.txt for probes 1-4. duckdb_iceberg.txt and the nightly CLI for probe 5, which
      # reads a real parquet through DuckDB -- installing the ENGINE's own environment rather
      # than putting duckdb in catalog.txt keeps the catalog-write environment engine-neutral,
      # and means the probe exercises exactly the build the bench job will use.
      - run: pip install -r requirements/catalog.txt -r requirements/duckdb_iceberg.txt
      - uses: ./.github/actions/duckdb-nightly
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python .github/scripts/auth_smoke.py
